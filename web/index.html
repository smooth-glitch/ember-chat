<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#1c1c1e"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#000000"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Ember</title>
    <link rel="icon" id="favicon" href="" />

    <!-- ---- PWA / "install as app" ---- everything below is what makes
         "Add to Home Screen" (iOS) and the install prompt (Android/desktop
         Chrome) turn this into a standalone app icon instead of just a
         bookmark -- no App Store, no Play Store, no review process. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS ignores manifest.json's display:standalone -- these three are
         what actually get Safari to launch it full-screen, no browser
         chrome, from a home-screen tap. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ember" />
    <style>
      :root {
        /* Minimalist, Apple-native identity -- neutral gray/white chrome
       (Liquid Glass has "no inherent color, it picks it up from content
       behind" per Apple's own guidance, so the glass surfaces themselves
       should be neutral, not brand-tinted) with a single restrained accent
       reserved for interactive elements, per the HIG's "sparing color use"
       guidance. Accent is Apple's own System Indigo rather than a plain
       "blue" -- distinctive without reintroducing the blue/gray look that
       was explicitly rejected earlier in this project. Every text-role
       color below is checked against WCAG AA (4.5:1 normal text) against
       its typical background. */
        --bg: #f5f5f7;
        --panel: #ffffff;
        --header: #ffffff;
        --header-2: #f5f5f7;
        --accent: #5856d6;
        --accent-2: #8482e0;
        --accent-gradient: linear-gradient(135deg, #5856d6, #7a78e0);
        --accent-dark: #423fc4;
        --accent-soft: #e8e7fb;
        --text: #1c1c1e;
        --muted: #6e6e73;
        --bubble-in: #ffffff;
        --bubble-out-grad: linear-gradient(135deg, #5856d6, #7a78e0);
        --border: #e5e5ea;
        --danger: #d70015;
        --warn-bg: #fff6e5;
        --warn-text: #9a6700;
        --radius: 18px;
        --shadow: 0 2px 14px rgba(0, 0, 0, 0.1);
        /* Strong, intentional curves -- built-in CSS easings are too weak to feel deliberate. */
        --ease: cubic-bezier(0.23, 1, 0.32, 1); /* entrances/exits */
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); /* on-screen movement */
        --ease-drawer: cubic-bezier(
          0.32,
          0.72,
          0,
          1
        ); /* iOS-style sheet/drawer */
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        height: 100vh;
      }
      @supports (height: 100dvh) {
        body {
          height: 100dvh;
        }
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      /* Explicit, not left to the browser's own light/dark form-control
     defaults -- otherwise a dark-mode browser can render an unstyled input
     with a system-dark background inside our own light card, or vice versa. */
      input,
      select {
        background: var(--panel);
        color: var(--text);
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* iOS zooms the page on focusing any input under 16px. Only bump it on touch
     devices so desktop keeps its tighter, more deliberate type sizes. !important
     is deliberate here, not a specificity shortcut: this rule sits near the top
     of the stylesheet, before the later, more specific selectors that set a
     smaller font-size on particular inputs (picker search boxes, modal inputs,
     e.g. the two-ID "#composer #emoji-search" rule) -- without it, those later
     same-or-higher-specificity rules would win the cascade on source order
     alone and silently defeat the zoom fix on exactly the inputs most likely
     to be tapped on a phone. This is a hard functional requirement (an iOS
     platform quirk, not a design preference), so forcing it to always win is
     the correct use of !important rather than a smell to design around. */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .hidden {
        display: none !important;
      }

      /* ---- Login ---- */
      #login {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background:
          radial-gradient(
            circle at 18% 20%,
            rgba(88, 86, 214, 0.45),
            transparent 45%
          ),
          radial-gradient(
            circle at 82% 28%,
            rgba(122, 120, 224, 0.3),
            transparent 45%
          ),
          radial-gradient(
            circle at 50% 92%,
            rgba(66, 63, 196, 0.35),
            transparent 55%
          ),
          linear-gradient(160deg, #1c1c2a, #0a0a10);
        background-size:
          180% 180%,
          180% 180%,
          180% 180%,
          100% 100%;
        animation: auroraDrift 24s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        #login {
          animation: none;
        }
      }
      @keyframes auroraDrift {
        from {
          background-position:
            0% 0%,
            100% 0%,
            50% 100%,
            0 0;
        }
        to {
          background-position:
            20% 15%,
            80% 20%,
            55% 85%,
            0 0;
        }
      }
      #login .card {
        background: var(--panel);
        padding: 36px 32px;
        border-radius: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        width: 100%;
        max-width: 340px;
        text-align: center;
        animation: cardIn 0.4s var(--ease);
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #login .logo {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        margin: 0 auto 16px;
        background: var(--accent-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: white;
        box-shadow: 0 6px 18px rgba(88, 86, 214, 0.4);
      }
      #login h1 {
        font-size: 21px;
        margin: 0 0 4px;
      }
      #login p {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 22px;
      }
      #login input {
        width: 100%;
        padding: 13px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 14px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      #login input:focus {
        border-color: var(--accent);
      }
      #login button {
        width: 100%;
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        transition:
          filter 0.15s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        #login button:hover {
          filter: brightness(1.08);
        }
      }
      #login button:active {
        transform: scale(0.98);
      }
      #login button:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }
      #login-error {
        color: var(--danger);
        font-size: 13px;
        min-height: 18px;
        margin-top: 10px;
      }

      /* ---- Google/Apple sign-in ----
         Neutral white/light "glass" pills rather than the coral CTA
         treatment #login button uses by default (a colored background on
         these specifically would fight both providers' own brand
         guidelines, which call for a neutral button with their logo, and
         the "reserve color for one primary action" Liquid Glass principle
         -- Join Chat stays the one coral action here, these two stay
         neutral). Selector is qualified with #login to outrank the plain
         "#login button" rule further down the cascade at matching
         specificity, the same trap fixed earlier for #composer's inputs. */
      #oauth-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 18px;
      }
      #login .oauth-btn {
        width: 100%;
        min-height: 44px;
        background: var(--panel);
        color: var(--text);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
        font-size: 14.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          background 0.15s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        #login .oauth-btn:hover {
          background: #ececee;
        }
      }
      #login .oauth-btn:active {
        transform: scale(0.98);
      }
      #login-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 16px;
        color: var(--muted);
        font-size: 12px;
      }
      #login-divider::before,
      #login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ---- App shell ---- */
      #app {
        display: none;
        height: 100%;
        position: relative;
      }
      #app.active {
        display: flex;
      }

      #reconnect-banner {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 25;
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 13px;
        text-align: center;
        padding: 8px;
        font-weight: 600;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
      }
      #reconnect-banner.show {
        display: block;
        animation: slideDown 0.2s var(--ease);
      }
      @keyframes slideDown {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(0);
        }
      }

      #backdrop {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 15;
      }
      #backdrop.show {
        display: block;
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ---- Sidebar ---- */
      #sidebar {
        width: 320px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.24s var(--ease-drawer);
      }
      #sidebar .me {
        background: var(--header);
        color: var(--text);
        /* Must match #topbar's vertical padding AND min-height exactly --
           both bars sit side-by-side at the same height on desktop. Padding
           alone isn't enough to guarantee this: #topbar's own .icon-btns
           (#menu-btn, #members-btn) are conditionally hidden at desktop
           widths / outside a group chat, while #logout-btn here is always
           visible, so without an explicit shared min-height #topbar's
           content-driven height silently shrinks to text-only (56px)
           while this bar stays icon-driven (69px) -- a real seam that was
           missed the first time this was "fixed" by padding alone. */
        min-height: 68px;
        padding: 12px 16px;
        padding-top: max(12px, env(safe-area-inset-top));
        /* Only the left edge, not both: the mobile drawer is capped at
           min(86vw, 340px) (see its @media rule below), so its right edge
           is an internal boundary within the app, never the actual side of
           the device the way its left edge is when the drawer is open. */
        padding-left: max(16px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #sidebar .me .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      #sidebar .me .avatar {
        width: 34px;
        height: 34px;
        font-size: 14px;
        flex-shrink: 0;
      }
      #sidebar .me .title {
        font-weight: 600;
        font-size: 14px;
      }
      #sidebar .me small {
        display: block;
        font-weight: 400;
        opacity: 0.7;
        font-size: 11px;
      }
      .icon-btn {
        background: none;
        border: none;
        color: inherit;
        font-size: 18px;
        line-height: 1;
        padding: 6px 8px;
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition:
          background 0.15s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        .icon-btn:hover {
          background: rgba(255, 255, 255, 0.12);
        }
        /* #topbar/#sidebar .me now follow light/dark theme instead of
           always being dark (see --header), so their icon buttons need a
           dark hover tint in light mode -- the white one above is only
           right against a genuinely dark bar, restored for dark mode
           below. */
        #topbar .icon-btn:hover,
        #sidebar .me .icon-btn:hover {
          background: rgba(0, 0, 0, 0.06);
        }
      }
      .icon-btn:active {
        transform: scale(0.88);
      }
      #sidebar-close {
        display: none;
      }

      #new-group-btn {
        margin: 12px 14px;
        background: var(--accent-soft);
        color: var(--accent-dark);
        border: none;
        border-radius: 14px;
        padding: 11px;
        min-height: 44px;
        font-size: 13.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition:
          background 0.15s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        #new-group-btn:hover {
          background: var(--accent-soft);
        }
      }
      #new-group-btn:active {
        transform: scale(0.98);
      }

      .section-label {
        padding: 6px 16px;
        font-size: 11.5px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.06em;
        font-weight: 700;
      }
      #chat-list,
      #online-list {
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      #chat-list {
        flex-shrink: 0;
        max-height: 48%;
      }
      #online-list {
        flex: 1;
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .row-item {
        padding: 10px 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 11px;
        border-radius: 10px;
        margin: 2px 8px;
        transition:
          background 0.12s ease,
          transform 0.08s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        .row-item:hover {
          background: #f5f6f6;
        }
      }
      .row-item:active {
        transform: scale(0.98);
      }
      .row-item.active {
        background: var(--accent-soft);
      }
      .row-item .avatar {
        flex-shrink: 0;
      }
      .row-item .meta {
        min-width: 0;
        flex: 1;
      }
      .row-item .name-line {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
      }
      .row-item .name {
        font-size: 14.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-item .preview {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .row-item .time {
        font-size: 10.5px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .badge {
        background: var(--accent-gradient);
        color: white;
        font-size: 11px;
        font-weight: 700;
        border-radius: 999px;
        min-width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        flex-shrink: 0;
      }
      .badge.pop {
        animation: badgePop 0.2s var(--ease);
      }
      @keyframes badgePop {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
        flex-shrink: 0;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 15px;
        font-weight: 700;
        user-select: none;
        overflow: hidden;
        position: relative;
      }
      .avatar.group {
        font-size: 17px;
      }
      /* A real profile photo overlays the initials-on-color fallback --
         overflow:hidden on .avatar above is what actually clips this to
         the circle, border-radius alone doesn't clip a child element. */
      .avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #empty-chats {
        padding: 10px 16px;
        font-size: 12.5px;
        color: var(--muted);
      }

      /* ---- Main ---- */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      #topbar {
        background: var(--header);
        color: var(--text);
        min-height: 68px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: max(12px, env(safe-area-inset-top));
        /* In landscape, an iPhone's notch/Dynamic Island sits to one side
           rather than centered at the top -- viewport-fit=cover (see the
           <meta name="viewport"> tag) means this bar draws under it unless
           the side insets are respected too, not just the top one. */
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      #topbar-title {
        font-weight: 600;
        font-size: 15px;
      }
      #topbar-sub {
        font-weight: 400;
        opacity: 0.7;
        font-size: 11.5px;
      }
      #topbar .spacer {
        flex: 1;
      }
      #menu-btn {
        display: none;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        background-image:
          radial-gradient(
            circle at 18% 8%,
            rgba(88, 86, 214, 0.045),
            transparent 42%
          ),
          radial-gradient(
            circle at 88% 82%,
            rgba(122, 120, 224, 0.04),
            transparent 42%
          );
      }
      #empty-conversation {
        margin: auto;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        max-width: 260px;
      }

      #jump-latest {
        position: absolute;
        left: 50%;
        bottom: 78px;
        z-index: 5;
        background: var(--header);
        color: white;
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        min-height: 40px;
        font-size: 12.5px;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translate(-50%, 8px);
        pointer-events: none;
        transition:
          opacity 0.15s ease,
          transform 0.15s var(--ease);
      }
      #jump-latest.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      #jump-latest:active {
        transform: translate(-50%, 0) scale(0.95);
      }

      /* Messages from the same sender in a row sit close together (grouped);
     a new speaker gets a clear gap above -- so who's-talking-when reads at
     a glance instead of requiring you to check the name label every time. */
      #messages > *:first-child {
        margin-top: 0 !important;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 78%;
        margin-top: 12px;
        min-width: 0;
      }
      .row.grouped {
        margin-top: 2px;
      }
      .row.enter {
        animation: msgIn 0.22s var(--ease);
      }
      @keyframes msgIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .row.flash .msg {
        animation: replyFlash 0.9s ease;
      }
      @keyframes replyFlash {
        0%,
        100% {
          box-shadow: var(--shadow);
        }
        30% {
          box-shadow:
            0 0 0 3px var(--accent-soft),
            var(--shadow);
        }
      }
      .row.out {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .row.in {
        align-self: flex-start;
      }
      /* ---- Swipe-to-reply (touch) ----
         Swipe any message right to reply, WhatsApp/iMessage-style, instead
         of only the small always-tappable reply-trigger icon. position:
         relative anchors .swipe-reply-icon (absolute, poking out to the
         left of the row as it slides). touch-action:pan-y hands vertical
         drags to native list scrolling by default -- the gesture handler in
         <script> only claims the drag once it detects clearly-horizontal
         intent, same disambiguation the sidebar drawer's swipe already
         uses. */
      .row {
        position: relative;
        touch-action: pan-y;
      }
      .row.swipe-reset {
        transition: transform 0.2s var(--ease);
      }
      .swipe-reply-icon {
        position: absolute;
        top: 50%;
        left: -6px;
        width: 30px;
        height: 30px;
        margin-top: -15px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.6);
      }
      .swipe-reply-icon.ready {
        background: var(--accent);
        color: #fff;
      }
      .row .avatar {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }
      .avatar-spacer {
        width: 28px;
        flex-shrink: 0;
      }

      .msg {
        padding: 9px 13px;
        border-radius: 18px;
        font-size: 14.5px;
        line-height: 1.45;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        box-shadow: var(--shadow);
        position: relative;
        /* .msg is a flex item of .row -- without this, flexbox's default
           min-width:auto forces it (and everything inside, e.g. an
           unbroken URL in a nowrap-truncated .reply-quote-text) to never
           shrink below its content's intrinsic width, blowing out the
           whole message list into horizontal scroll regardless of
           overflow-wrap/text-overflow on the content itself. */
        min-width: 0;
      }
      .msg .from {
        font-size: 12px;
        font-weight: 700;
        color: var(--sender-color, var(--accent));
        display: block;
        margin-bottom: 2px;
      }
      /* --sender-color is set inline per bubble (from the same hash-based
     palette as the avatar), so each participant reads as one consistent
     color across avatar, name and accent bar -- the actual fix for telling
     different senders apart in a shared room without re-reading labels. */
      .msg.in {
        background: var(--bubble-in);
        border-left: 3px solid var(--sender-color, transparent);
      }
      .msg.out {
        background: var(--bubble-out-grad);
        color: #fff;
      }
      .msg.out .from {
        color: rgba(255, 255, 255, 0.85);
      }
      .deleted-msg {
        font-style: italic;
        opacity: 0.7;
      }
      .msg.private {
        border-left: 3px solid var(--warn-text);
      }
      .msg.out.private {
        border-left-color: rgba(255, 255, 255, 0.6);
      }
      .ticks {
        font-size: 11px;
        margin-left: 6px;
        opacity: 0.75;
        letter-spacing: -1px;
      }
      .ticks.read {
        opacity: 1;
        color: #2fa88c;
      }
      .msg.image-msg {
        padding: 4px;
      }
      .msg.image-msg img {
        display: block;
        max-width: 260px;
        max-height: 260px;
        border-radius: 8px;
      }
      .msg.audio-msg {
        padding: 8px 10px;
      }
      .msg.audio-msg audio {
        display: block;
        width: 240px;
        max-width: 60vw;
        height: 36px;
      }

      /* ---- Reactions ---- */
      .react-trigger {
        position: absolute;
        top: -10px;
        width: 24px;
        height: 24px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 50%;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
        opacity: 0;
        transition:
          opacity 0.15s ease,
          transform 0.1s var(--ease);
      }
      .row.in .react-trigger {
        right: -8px;
      }
      .row.out .react-trigger {
        left: -8px;
      }
      /* Keep the visible circle compact (24px, matching how dense per-message
         secondary actions look in most polished chat apps) while still
         meeting the ~44pt touch-target guidance -- expand the invisible
         hit area with a pseudo-element rather than the button's own visual
         size. Clicks/taps anywhere in the expanded zone still register on
         the real button since ::after is part of its box for hit-testing. */
      .react-trigger::after {
        content: "";
        position: absolute;
        inset: -10px;
      }
      .react-trigger:active {
        transform: scale(0.88);
      }
      @media (hover: hover) and (pointer: fine) {
        .row:hover .react-trigger {
          opacity: 1;
        }
      }
      @media (hover: none) {
        .react-trigger {
          opacity: 0.6;
        }
      }
      .reply-trigger {
        position: absolute;
        top: -10px;
        width: 24px;
        height: 24px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 50%;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
        opacity: 0;
        transition:
          opacity 0.15s ease,
          transform 0.1s var(--ease);
      }
      .row.in .reply-trigger {
        right: 20px;
      }
      .row.out .reply-trigger {
        left: 20px;
      }
      .reply-trigger::after {
        content: "";
        position: absolute;
        inset: -10px;
      }
      .reply-trigger:active {
        transform: scale(0.88);
      }
      @media (hover: hover) and (pointer: fine) {
        .row:hover .reply-trigger {
          opacity: 1;
        }
      }
      @media (hover: none) {
        .reply-trigger {
          opacity: 0.6;
        }
      }
      .reactions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      .reaction-pill {
        background: rgba(0, 0, 0, 0.06);
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        color: inherit;
        display: inline-flex;
        align-items: center;
        transition:
          background 0.1s ease,
          transform 0.08s var(--ease);
      }
      .reaction-pill.mine {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--text);
      }
      .msg.out .reaction-pill {
        background: rgba(255, 255, 255, 0.22);
      }
      .msg.out .reaction-pill.mine {
        background: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.7);
      }
      .reaction-pill:active {
        transform: scale(0.92);
      }

      /* ---- Link previews ---- */
      .link-preview {
        display: block;
        margin-top: 8px;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.08);
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.1s var(--ease),
          background 0.15s ease;
      }
      .link-preview.enter {
        animation: msgIn 0.22s var(--ease);
      }
      .msg.out .link-preview {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.22);
      }
      @media (hover: hover) and (pointer: fine) {
        .link-preview:hover {
          background: rgba(0, 0, 0, 0.07);
        }
        .msg.out .link-preview:hover {
          background: rgba(255, 255, 255, 0.2);
        }
      }
      .link-preview:active {
        transform: scale(0.98);
      }
      .link-preview img {
        display: block;
        width: 100%;
        max-height: 160px;
        object-fit: cover;
      }
      .link-preview-text {
        padding: 8px 10px;
      }
      .link-preview-title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .link-preview-desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
        margin-top: 2px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .msg.out .link-preview-desc {
        color: rgba(255, 255, 255, 0.75);
      }

      #quick-react-popup {
        position: fixed;
        z-index: 35;
        display: flex;
        gap: 2px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        animation: popIn 0.15s var(--ease);
      }
      #quick-react-popup.closing {
        animation: popOut 0.14s var(--ease) forwards;
      }
      #quick-react-popup button {
        font-size: 21px;
        background: none;
        border: none;
        padding: 5px;
        border-radius: 50%;
        line-height: 1;
        transition:
          transform 0.1s var(--ease),
          background 0.1s ease;
      }
      #quick-react-popup button:active {
        transform: scale(0.85);
      }
      @media (hover: hover) and (pointer: fine) {
        #quick-react-popup button:hover {
          background: var(--accent-soft);
          transform: scale(1.18);
        }
      }
      #quick-react-popup #quick-react-more {
        color: var(--muted);
        font-weight: 700;
        font-size: 19px;
      }

      /* ---- Message action menu (long-press) ----
         The Reply/Copy list that appears alongside the quick-react popup on
         a long-press, iOS-context-menu style. Only Reply and Copy Text are
         real capabilities this app has -- deliberately not adding
         Forward/Star/Delete just to match a reference screenshot's full
         button list when the backend has nothing behind them. */
      #message-action-menu {
        position: fixed;
        z-index: 35;
        display: flex;
        flex-direction: column;
        min-width: 190px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        animation: popIn 0.15s var(--ease);
      }
      #message-action-menu.closing {
        animation: popOut 0.14s var(--ease) forwards;
      }
      #message-action-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14.5px;
        text-align: left;
        color: var(--text);
        background: none;
        border: none;
        min-height: 44px;
      }
      #message-action-menu button.danger {
        color: var(--danger);
      }
      #message-action-menu .action-icon {
        font-size: 16px;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
      }
      @media (hover: hover) and (pointer: fine) {
        #message-action-menu button:hover {
          background: rgba(0, 0, 0, 0.05);
        }
      }
      #message-action-menu button:active {
        background: var(--accent-soft);
      }

      .system-line {
        align-self: center;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 999px;
        max-width: 90%;
        text-align: center;
        margin: 6px 0;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.045);
      }
      .system-line.enter {
        animation: msgIn 0.2s var(--ease);
      }

      /* ---- Composer ---- */
      /* ---- Reply banner ----
         Sits directly above the composer while a reply is pending, pushed
         down by normal block flow rather than overlaid -- so it never
         covers the input or steals a tap meant for it. */
      #reply-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
      #reply-banner-bar {
        width: 3px;
        align-self: stretch;
        border-radius: 2px;
        background: var(--accent);
        flex-shrink: 0;
      }
      #reply-banner-body {
        flex: 1;
        min-width: 0;
      }
      #reply-banner-from {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--accent);
      }
      #reply-banner-text {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #reply-banner-cancel {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 13px;
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;
      }
      @media (hover: hover) and (pointer: fine) {
        #reply-banner-cancel:hover {
          background: rgba(0, 0, 0, 0.06);
        }
      }
      #reply-banner-cancel:active {
        transform: scale(0.9);
      }

      /* ---- Reply quote (rendered inside a bubble that IS a reply) ---- */
      .reply-quote {
        display: block;
        padding: 5px 8px;
        margin-bottom: 5px;
        border-left: 3px solid var(--accent);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.05);
        cursor: pointer;
      }
      .msg.out .reply-quote {
        border-left-color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.16);
      }
      .reply-quote-from {
        font-size: 12px;
        font-weight: 700;
        color: var(--sender-color, var(--accent));
      }
      .msg.out .reply-quote-from {
        color: rgba(255, 255, 255, 0.9);
      }
      .reply-quote-text {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg.out .reply-quote-text {
        color: rgba(255, 255, 255, 0.75);
      }
      /* Reply quote for a GIF/sticker/photo/voice-note original -- a small
         thumbnail + type badge instead of the raw media URL as text. Shared
         between the in-bubble reply-quote and the composer's reply-banner
         (see buildReplyQuoteBody), so these have to look right on both a
         colored .msg.out bubble and the plain composer panel background. */
      .reply-quote-media {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .reply-quote-media-audio {
        font-size: 12.5px;
        color: var(--muted);
      }
      .msg.out .reply-quote-media-audio {
        color: rgba(255, 255, 255, 0.75);
      }
      .reply-quote-thumb {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .reply-quote-media-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .msg.out .reply-quote-media-label {
        color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.22);
      }

      #composer {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        align-items: center;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
        position: relative;
      }
      /* The message input and its inline picker button live inside one pill
         (#input-pill), not as two separate composer children -- matching the
         single-row "+ | pill-input-with-icon | camera | mic" layout the rest
         of this app's icon-heavy composer was cluttering. #msg-input itself
         is borderless/transparent so the pill wrapper supplies the visible
         border/background, and #content-btn sits inside on the trailing
         edge, sized down from the other composer icons so it doesn't
         compete with the mic/send/camera circle for attention. */
      #input-pill {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-end;
        padding: 0 4px 0 16px;
        border-radius: 24px;
        border: 1.5px solid var(--border);
        transition: border-color 0.15s ease;
      }
      #input-pill:focus-within {
        border-color: var(--accent);
      }
      #composer #emoji-search,
      #composer #gif-search,
      #composer #sticker-search {
        flex: none;
        margin: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        outline: none;
      }
      /* #msg-input specifically: a growing textarea, not a fixed-height
         input -- rows="1" plus this starting height/line-height keeps it
         visually identical to the old single-line input until JS (see
         autoGrowMsgInput) adjusts height to match content as someone types
         a longer, multi-line message. resize:none because the composer
         handles sizing itself; a user-draggable resize handle would fight
         that and look out of place next to the round icon buttons. */
      #msg-input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        padding: 12px 4px 12px 0;
        outline: none;
        resize: none;
        max-height: 120px;
        line-height: 1.3;
        font-family: inherit;
        font-size: 16px;
      }
      /* Visually 32px (so it doesn't compete with the pill for space at
         narrow widths) but the real tap target still meets the ~44pt
         guidance via an invisible expanded hit-area, same pattern as
         .react-trigger/.reply-trigger elsewhere in this file. */
      #input-pill #content-btn {
        position: relative;
        flex-shrink: 0;
        min-width: 32px;
        min-height: 32px;
        font-size: 17px;
        margin-bottom: 5px;
      }
      #input-pill #content-btn::after {
        content: "";
        position: absolute;
        inset: -8px;
      }
      #composer .icon-btn {
        color: var(--muted);
        font-size: 21px;
      }
      @media (hover: hover) and (pointer: fine) {
        #composer .icon-btn:hover {
          background: #ececee;
        }
      }
      #send-btn,
      #mic-btn {
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          filter 0.15s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        #send-btn:hover,
        #mic-btn:hover {
          filter: brightness(1.08);
          background: var(--accent-gradient);
        }
      }
      #send-btn:active,
      #mic-btn:active {
        transform: scale(0.92);
      }
      #send-btn:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }

      /* ---- Voice notes ----
         send-btn and mic-btn occupy the same slot: the composer shows
         whichever one is relevant (mic when the input is empty, send once
         there's text to send) rather than a permanently-disabled send icon
         sitting next to a separate always-visible mic icon. */
      #mic-btn.recording {
        color: var(--danger);
      }
      #recording-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }
      #recording-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        flex-shrink: 0;
        animation: recordingPulse 1.1s ease-in-out infinite;
      }
      @keyframes recordingPulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.8);
        }
      }
      #recording-time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        font-weight: 600;
        flex-shrink: 0;
      }
      #recording-wave {
        flex: 1;
        min-width: 0;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      #recording-wave span {
        flex: 1;
        max-width: 4px;
        height: 4px;
        border-radius: 2px;
        background: var(--danger);
        transition: height 0.08s ease;
      }
      #recording-cancel,
      #recording-send {
        border: none;
        background: none;
        flex-shrink: 0;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s var(--ease);
      }
      #recording-cancel {
        color: var(--muted);
        margin-left: auto;
      }
      #recording-send {
        background: var(--accent-gradient);
        color: white;
      }
      #recording-cancel:active,
      #recording-send:active {
        transform: scale(0.9);
      }
      @media (hover: hover) and (pointer: fine) {
        #recording-cancel:hover {
          background: #ececee;
        }
        #recording-send:hover {
          filter: brightness(1.08);
        }
      }

      /* ---- Content picker (emoji + GIFs + stickers, one panel one button) ----
         Merged from three separate pickers into one tabbed panel: on narrow
         phones, three always-visible composer buttons left too little room
         for the message input itself, and a single familiar "tap the smiley,
         switch tabs" pattern (WhatsApp/Telegram) reads as more polished than
         a row of small icons anyway. Emoji/GIF/sticker fetch and render logic
         is otherwise unchanged -- this only touches the container/chrome. */
      #content-panel {
        position: absolute;
        bottom: 64px;
        left: 12px;
        width: 300px;
        /* A fixed 360px overflows off the top of the viewport in landscape
           on shorter phones (measured -34px of top overflow at a 371px-tall
           viewport) -- cap it to whatever's actually available above the
           composer instead of a constant that assumes a tall-enough screen. */
        height: min(360px, calc(100vh - 90px));
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 20;
        transform-origin: bottom left;
        animation: popIn 0.15s var(--ease);
      }
      #content-panel.closing {
        animation: popOut 0.14s var(--ease) forwards;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes popOut {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
      #content-tabs {
        display: flex;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .content-tab {
        flex: 1;
        min-height: 44px;
        background: none;
        border: none;
        padding: 10px 4px 9px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .content-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      @media (hover: hover) and (pointer: fine) {
        .content-tab:not(.active):hover {
          color: var(--text);
        }
      }
      .content-view {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      #emoji-grid {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0 8px 8px;
        flex: 1;
      }
      .emoji-group-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        padding: 6px 4px 2px;
        font-weight: 700;
      }
      .emoji-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .emoji-cell {
        font-size: 21px;
        background: none;
        border: none;
        padding: 5px 0;
        border-radius: 6px;
        transition:
          background 0.1s ease,
          transform 0.1s var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        .emoji-cell:hover {
          background: #ececee;
          transform: scale(1.15);
        }
      }
      .emoji-cell:active {
        transform: scale(0.85);
      }
      /* A fixed-height scroll container with CSS multi-column (column-count)
         overflows *sideways* into new columns once content exceeds that
         height, instead of growing the existing columns down -- exactly
         backwards from the vertically-scrolling grid this picker needs.
         CSS Grid with a fixed column count has no such trap: rows just keep
         flowing downward regardless of how much content there is. */
      #gif-grid,
      #sticker-grid {
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 0 8px 8px;
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        align-content: start;
      }
      /* Square cells via the classic padding-top(100%) box, not the
         aspect-ratio property: measured live in this grid, aspect-ratio
         alone left every implicit row track only ~14px tall regardless of
         the item's actual 148px-square rendered size (row auto-sizing
         wasn't picking up the aspect-ratio-derived height at all), so
         every row overlapped the next by ~85% and read as thin sliced
         color bands instead of a clean grid. padding-top's percentage
         resolves against the item's own already-known column width and is
         real box-model height -- always included in track sizing, unlike
         aspect-ratio here. */
      .gif-cell {
        display: block;
        position: relative;
        width: 100%;
        padding: 0;
        padding-top: 100%;
        height: 0;
        border: none;
        background: none;
        border-radius: 8px;
        overflow: hidden;
        transition:
          transform 0.1s var(--ease),
          opacity 0.1s ease;
      }
      .gif-cell img {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.06);
      }
      @media (hover: hover) and (pointer: fine) {
        .gif-cell:hover {
          transform: scale(1.03);
        }
      }
      .gif-cell:active {
        transform: scale(0.96);
        opacity: 0.85;
      }
      .gif-status {
        padding: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12.5px;
      }
      .giphy-attrib {
        padding: 4px 10px 8px;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
        opacity: 0.7;
      }
      /* ---- Modals ---- */
      #modal-layer {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modal-layer.hidden {
        display: none;
      }
      #modal-scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        animation: fadeIn 0.15s ease;
      }
      #modal-scrim.closing {
        animation: fadeIn 0.16s ease reverse forwards;
      }
      .modal {
        position: relative;
        background: var(--panel);
        border-radius: var(--radius);
        width: 92%;
        max-width: 380px;
        max-height: 82vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        animation: modalIn 0.22s var(--ease);
      }
      .modal.closing {
        animation: modalOut 0.16s var(--ease) forwards;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes modalOut {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
      }
      .modal-header {
        padding: 18px 20px 10px;
        font-size: 17px;
        font-weight: 700;
      }
      .modal-body {
        padding: 4px 20px;
        overflow-y: auto;
        overscroll-behavior: contain;
        flex: 1;
      }
      .modal-body input[type="text"] {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--border);
        border-radius: 9px;
        font-size: 15px;
        outline: none;
        margin-bottom: 12px;
      }
      .modal-body input[type="text"]:focus {
        border-color: var(--accent);
      }
      .invite-row,
      .member-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 4px;
        border-radius: 8px;
      }
      @media (hover: hover) and (pointer: fine) {
        .invite-row:hover {
          background: #f5f6f6;
        }
      }
      .invite-row input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      .member-row .name {
        flex: 1;
        font-size: 14px;
      }
      .modal-footer {
        padding: 14px 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--border);
      }
      .btn {
        padding: 10px 16px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: none;
        font-size: 13.5px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          transform 0.1s var(--ease);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent-gradient);
        color: white;
      }
      @media (hover: hover) and (pointer: fine) {
        .btn-primary:hover {
          filter: brightness(1.08);
        }
      }
      .btn-primary:disabled {
        opacity: 0.5;
      }
      .btn-secondary {
        background: #ececee;
        color: var(--text);
      }
      @media (hover: hover) and (pointer: fine) {
        .btn-secondary:hover {
          background: #dcdce0;
        }
      }
      .btn-danger {
        background: #fde2e1;
        color: #a12727;
        margin-right: auto;
      }
      @media (hover: hover) and (pointer: fine) {
        .btn-danger:hover {
          background: #fbd3d1;
        }
      }
      #modal-empty-hint {
        color: var(--muted);
        font-size: 13px;
        padding: 12px 4px;
      }

      .add-member-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .add-member-row select {
        flex: 1;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1.5px solid var(--border);
        font-size: 13.5px;
      }

      /* ---- Profile modal ---- */
      #profile-avatar-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }
      #profile-avatar-preview {
        width: 72px;
        height: 72px;
        font-size: 26px;
      }
      #profile-photo-label {
        cursor: pointer;
      }
      #profile-status-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        font-size: 14px;
        margin-top: 6px;
        margin-bottom: 12px;
      }
      #profile-status-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .status-preset {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1.5px solid var(--border);
        background: var(--panel);
        font-size: 12.5px;
        color: var(--text);
      }
      @media (hover: hover) and (pointer: fine) {
        .status-preset:hover {
          background: var(--accent-soft);
          border-color: var(--accent);
        }
      }
      #me-who {
        cursor: pointer;
      }
      #me-status {
        display: block;
        opacity: 0.85;
      }

      /* ---- Toasts ---- */
      #toast-container {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        background: rgba(28, 28, 30, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: white;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        animation: toastIn 0.2s var(--ease);
        max-width: 90vw;
      }
      .toast.error {
        background: rgba(163, 47, 42, 0.92);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast.fading {
        animation: toastOut 0.2s var(--ease) forwards;
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      /* ---- Responsive ---- */
      @media (max-width: 820px) {
        #menu-btn {
          display: inline-flex;
        }
        #sidebar-close {
          display: inline-flex;
        }
        #sidebar {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          z-index: 16;
          width: min(86vw, 340px);
          transform: translateX(-100%);
          box-shadow: 2px 0 12px rgba(0, 0, 0, 0.18);
          touch-action: pan-y; /* horizontal drags are ours (swipe-to-close); vertical stays native scroll */
        }
        #sidebar.open {
          transform: translateX(0);
        }
        #sidebar.dragging {
          transition: none;
        }
        .row {
          max-width: 90%;
        }
        #content-panel {
          width: min(90vw, 320px);
        }
      }

      /* ---- Dark mode ---- */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --panel: #1c1c1e;
          --header: #000000;
          --header-2: #1c1c1e;
          /* Brighter than Apple's raw systemIndigo dark value (#5e5ce6,
             which only hits 3.36:1 on the dark panel -- fine for a UI-
             component fill but not for the small bold text that also uses
             --accent, e.g. #reply-banner-from) so it stays legible as text
             too, not just as a background/icon color. */
          --accent: #8583ea;
          --accent-2: #a09eed;
          --accent-gradient: linear-gradient(135deg, #5e5ce6, #8785ea);
          --accent-dark: #7674e0;
          --text: #f2f2f7;
          --muted: #8e8e93;
          --accent-soft: #2a2a5c;
          --bubble-in: #2c2c2e;
          --bubble-out-grad: linear-gradient(135deg, #5e5ce6, #8785ea);
          --border: #38383a;
          --warn-bg: #3a2e0b;
          --warn-text: #f0c674;
        }
        .row-item.active {
          background: #2a2a5c;
        }
        .system-line {
          background: rgba(255, 255, 255, 0.08);
        }
        .btn-secondary {
          background: #2c2c2e;
          color: var(--text);
        }
        .btn-danger {
          background: #3a1214;
          color: #ff6b64;
        }
        /* The composer (and its reply-banner, directly above it) used
           --panel here, same as every other card/surface -- but #topbar and
           #sidebar .me already sit on pure black (--header), so a graphite
           #1c1c1e composer bar read as a mismatched grey strip against the
           black chrome everywhere else. Match --bg (true black) instead,
           specifically in dark mode -- light mode's white-panel-on-light-
           gray-bg composer isn't the reported problem and stays as-is. */
        #composer,
        #reply-banner {
          background: var(--bg);
        }
      }
      @media (prefers-color-scheme: dark) and (hover: hover) and (pointer: fine) {
        #topbar .icon-btn:hover,
        #sidebar .me .icon-btn:hover {
          background: rgba(255, 255, 255, 0.12);
        }
      }
      @media (prefers-color-scheme: dark) and (hover: hover) and (pointer: fine) {
        .row-item:hover {
          background: #2c2c2e;
        }
        #new-group-btn:hover {
          background: #4b49c8;
        }
        #composer .icon-btn:hover {
          background: #2c2c2e;
        }
        .emoji-cell:hover {
          background: #2c2c2e;
        }
        .btn-secondary:hover {
          background: #3a3a3c;
        }
      }

      /* ---- Reduced motion: keep quick opacity feedback, drop movement ---- */
      @media (prefers-reduced-motion: reduce) {
        .row.enter,
        .system-line.enter,
        #login .card,
        .badge.pop {
          animation: none !important;
        }
        #recording-dot {
          animation: none !important;
          opacity: 1;
        }
        #sidebar {
          transition: none !important;
        }
        .row-item:active,
        .icon-btn:active,
        #send-btn:active,
        .btn:active,
        #login button:active,
        .emoji-cell:active,
        #jump-latest:active,
        .react-trigger:active,
        .reply-trigger:active,
        .reaction-pill:active,
        #quick-react-popup button:active,
        .gif-cell:active,
        #recording-cancel:active,
        #recording-send:active,
        #reply-banner-cancel:active {
          transform: none !important;
        }
        #modal-scrim,
        .modal,
        #content-panel,
        #backdrop.show,
        .toast,
        #reconnect-banner.show,
        #quick-react-popup {
          animation-duration: 0.12s !important;
        }
        .row.flash .msg {
          animation: none !important;
        }
        html {
          scroll-behavior: auto !important;
        }
      }

      /* ---- Liquid Glass (Apple platforms only, iOS/iPadOS/macOS) ----
     Applied only when html.liquid-glass is present (see the platform check
     at the top of the script) AND the browser supports backdrop-filter.
     Floating/chrome surfaces become translucent, light-catching material;
     content stays flat so nothing competes with message text. Falls back
     to the flat theme under prefers-reduced-transparency, unconditionally
     (not gated behind detecting that the media feature even matched --
     the fallback rule below only *overrides*, so an unsupported feature
     query simply never fires and glass stays on, which is the safe
     direction to fail in). */
      /* Light-mode tint here -- previously this was the same dark charcoal
         gradient unconditionally in both modes (a leftover from when the
         header was always dark regardless of theme), so a light-theme user
         saw a grey/dark bar against otherwise-white chrome. The matching
         dark-mode gradient is restored below under
         prefers-color-scheme:dark, same visual as before in that mode. */
      html.liquid-glass #topbar,
      html.liquid-glass #sidebar .me {
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.66),
          rgba(255, 255, 255, 0.48)
        );
        backdrop-filter: blur(28px) saturate(230%) brightness(1.05);
        -webkit-backdrop-filter: blur(28px) saturate(230%) brightness(1.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      html.liquid-glass #sidebar {
        background: rgba(255, 255, 255, 0.46);
        backdrop-filter: blur(34px) saturate(220%) brightness(1.04);
        -webkit-backdrop-filter: blur(34px) saturate(220%) brightness(1.04);
        border-right-color: rgba(255, 255, 255, 0.4);
      }
      html.liquid-glass #composer {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(26px) saturate(220%) brightness(1.04);
        -webkit-backdrop-filter: blur(26px) saturate(220%) brightness(1.04);
        border-top-color: rgba(255, 255, 255, 0.5);
      }
      /* Body-text-bearing surfaces get a higher base opacity than chrome --
     legibility for paragraph content needs more contrast headroom than a
     mostly-decorative topbar does (Liquid Glass design guidance: verify
     contrast on glass surfaces, don't assume the blur alone is enough). */
      html.liquid-glass .modal,
      html.liquid-glass .toast,
      html.liquid-glass #jump-latest,
      html.liquid-glass #login .card,
      html.liquid-glass #quick-react-popup,
      html.liquid-glass #message-action-menu {
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(28px) saturate(230%) brightness(1.05);
        -webkit-backdrop-filter: blur(28px) saturate(230%) brightness(1.05);
        border: 1px solid rgba(255, 255, 255, 0.45);
      }
      /* #content-panel needs more opacity than the other glass surfaces
         above: a modal sits behind #modal-scrim (which already dims the
         content layer before glass is even applied), but this panel floats
         directly over the live, often text-dense message list with nothing
         dimming it first -- at the same alpha as a modal, chat text and
         link-preview cards behind it visibly ghosted through and hurt
         legibility of the panel's own tabs/search/labels. HIG guidance:
         "use the regular [more opaque] variant... when components have a
         significant amount of text, such as alerts, sidebars, or popovers."
         The extra saturate()/brightness() keeps it from reading as flat and
         chalky despite the higher opacity -- real Liquid Glass stays vivid
         and color-bleeding even on its more opaque "regular" variant, it's
         only ever more opaque, never desaturated. */
      html.liquid-glass #content-panel {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(36px) saturate(220%) brightness(1.06);
        -webkit-backdrop-filter: blur(36px) saturate(220%) brightness(1.06);
        border: 1px solid rgba(255, 255, 255, 0.55);
      }
      html.liquid-glass #modal-scrim {
        backdrop-filter: blur(6px) saturate(140%);
        -webkit-backdrop-filter: blur(6px) saturate(140%);
      }
      html.liquid-glass .toast {
        color: var(--text);
      }
      html.liquid-glass .toast.error {
        background: rgba(245, 71, 107, 0.4);
        color: #fff;
      }
      /* Liquid Glass guidance: tint the glass itself rather than painting a
     solid fill -- an opaque gradient button reads as a regular button that
     happens to be colored, not as glass. Keep the same brand gradient as
     the non-glass fallback, just translucent and blurred like every other
     glass surface, with a soft diagonal sheen where light would catch it. */
      html.liquid-glass #send-btn,
      html.liquid-glass #mic-btn,
      html.liquid-glass .btn-primary,
      html.liquid-glass #login button,
      html.liquid-glass #new-group-btn {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          rgba(88, 86, 214, 0.6),
          rgba(105, 103, 219, 0.55) 55%,
          rgba(122, 120, 224, 0.5)
        );
        backdrop-filter: blur(18px) saturate(230%) brightness(1.06);
        -webkit-backdrop-filter: blur(18px) saturate(230%) brightness(1.06);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      html.liquid-glass #new-group-btn {
        color: #fff;
      }
      html.liquid-glass #send-btn::before,
      html.liquid-glass #mic-btn::before,
      html.liquid-glass .btn-primary::before,
      html.liquid-glass #login button::before,
      html.liquid-glass #new-group-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.4),
          transparent 45%,
          transparent 65%,
          rgba(255, 255, 255, 0.12)
        );
      }
      @media (prefers-color-scheme: dark) {
        html.liquid-glass #topbar,
        html.liquid-glass #sidebar .me {
          background: linear-gradient(
            160deg,
            rgba(40, 40, 46, 0.5),
            rgba(20, 20, 24, 0.65)
          );
          border-bottom-color: rgba(255, 255, 255, 0.14);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        html.liquid-glass #sidebar,
        html.liquid-glass .modal,
        html.liquid-glass .toast,
        html.liquid-glass #jump-latest,
        html.liquid-glass #login .card,
        html.liquid-glass #quick-react-popup,
        html.liquid-glass #message-action-menu {
          background: rgba(20, 20, 24, 0.62);
          border-color: rgba(255, 255, 255, 0.12);
        }
        /* #composer was missing from this dark-mode override entirely --
           it kept using the light-mode rgba(255,255,255,0.5) white glass
           tint (see the base html.liquid-glass #composer rule) even in
           dark mode, reading as a mismatched pale strip against the black
           chrome everywhere else. */
        html.liquid-glass #composer {
          background: rgba(10, 10, 12, 0.75);
          border-top-color: rgba(255, 255, 255, 0.12);
        }
        html.liquid-glass #content-panel {
          background: rgba(20, 20, 24, 0.82);
          border-color: rgba(255, 255, 255, 0.16);
        }
        html.liquid-glass .toast {
          color: var(--text);
        }
      }
      /* Increased Contrast: Apple's own Liquid Glass accessibility behavior
     goes predominantly solid with a defined contrasting border, rather
     than just turning the blur off (which reduced-transparency already
     covers on its own). */
      @media (prefers-contrast: more) {
        html.liquid-glass #topbar,
        html.liquid-glass #sidebar .me,
        html.liquid-glass #sidebar,
        html.liquid-glass #composer,
        html.liquid-glass .modal,
        html.liquid-glass #content-panel,
        html.liquid-glass .toast,
        html.liquid-glass #jump-latest,
        html.liquid-glass #login .card,
        html.liquid-glass #quick-react-popup,
        html.liquid-glass #message-action-menu {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: var(--panel);
          border-color: var(--text);
          border-width: 1.5px;
        }
        html.liquid-glass #topbar,
        html.liquid-glass #sidebar .me {
          background: var(--header);
          border-color: rgba(255, 255, 255, 0.6);
        }
        html.liquid-glass #send-btn,
        html.liquid-glass #mic-btn,
        html.liquid-glass .btn-primary,
        html.liquid-glass #login button,
        html.liquid-glass #new-group-btn {
          background: var(--accent-gradient);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          border-color: var(--text);
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        html.liquid-glass #topbar,
        html.liquid-glass #sidebar .me,
        html.liquid-glass #sidebar,
        html.liquid-glass #composer,
        html.liquid-glass .modal,
        html.liquid-glass #content-panel,
        html.liquid-glass .toast,
        html.liquid-glass #jump-latest,
        html.liquid-glass #login .card,
        html.liquid-glass #modal-scrim,
        html.liquid-glass #quick-react-popup,
        html.liquid-glass #message-action-menu {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: var(--panel);
        }
        html.liquid-glass #topbar,
        html.liquid-glass #sidebar .me {
          background: var(--header);
        }
        html.liquid-glass #send-btn,
        html.liquid-glass #mic-btn,

            <div>
              <div class="title">Ember</div>
              <small id="me-name"></small>
              <small id="me-status"></small>
            </div>
          </div>
          <div>
            <button

              id="logout-btn"
              title="Log out"
              aria-label="Log out"
            >
              &#8631;
            </button>
            <button class="icon-btn" id="sidebar-close" aria-label="Close">
              &times;
            </button>
          </div>
        </div>

        <button id="new-group-btn">&#43; New Group</button>

        <div class="section-label">Chats</div>
        <ul id="chat-list"></ul>

        <div class="section-label">Online</div>
        <ul id="online-list"></ul>
      </div>

            <div id="topbar-sub"></div>
          </div>

        <div

          aria-live="polite"

          <div id="reply-banner-body">
            <div id="reply-banner-from"></div>
            <div id="reply-banner-text"></div>
          </div>

            id="reply-banner-cancel"
            type="button"
            title="Cancel reply"
            aria-label="Cancel reply"
          >
            &#10005;
          </button>
        </div>
        <div id="composer">

            class="icon-btn"
            id="attach-btn"
            title="Attach"
            aria-label="Attach a photo"

            &#43;
          </button>
          <input
            id="attach-file-input"
            type="file"
            accept="image/png,image/jpeg,image/gif,image/webp"
            class="hidden"
          />

              rows="1"
              placeholder="Type a message"
              autocomplete="off"
              maxlength="2000"

            id="camera-btn"

            id="camera-file-input"

            accept="image/*"
            capture="environment"
            class="hidden"
          />

            id="send-btn"
            class="hidden"
            title="Send"
            aria-label="Send message"

          </button>

            class="icon-btn"
            id="mic-btn"
            title="Record a voice note"
            aria-label="Record a voice note"
          >
            &#127908;
          </button>

            </div>

              type="button"
              title="Discard"
              aria-label="Discard voice note"
            >
              &#128465;
            </button>
            <button
              id="recording-send"
              type="button"
              title="Send"
              aria-label="Send voice note"
            >
              &#10148;
            </button>
          </div>
          <div id="content-panel" class="hidden">
            <div id="content-tabs" role="tablist">
              <button
                type="button"
                class="content-tab active"
                id="tab-emoji"

                role="tab"
                aria-selected="true"

                class="content-tab"
                id="tab-gif"
                data-tab="gif"
                role="tab"
                aria-selected="false"

                type="button"
                class="content-tab"
                id="tab-sticker"

                role="tab"
                aria-selected="false"

                &#128444; Stickers

            </div>

                id="emoji-search"
                type="text"
                placeholder="Search emoji&hellip;"

                autocorrect="off"
              />
              <div id="emoji-grid"></div>
            </div>
            <div id="gif-view" class="content-view hidden">
              <input
                id="gif-search"
                type="text"
                placeholder="Search GIFs&hellip;"

              />
              <div id="gif-grid"></div>

        var pendingReactionTarget = null; // {msg, convKey} while the emoji tab is open for a custom reaction

        // ---- utility ----
        function avatarColor(name) {
          // Apple's own system color palette (or a slightly darkened variant
          // where the stock value's contrast against a white avatar-letter
          // was too low to read comfortably), for the same minimal/native
          // feel as the rest of the theme rather than an arbitrary hue set.
          var palette = [
            "#007aff", // blue
            "#af52de", // purple
            "#ff2d55", // pink
            "#0e8a9e", // teal
            "#248a3d", // green
            "#c76a00", // orange
            "#ff3b30", // red
            "#5e5ce6", // indigo
          ];
          var hash = 0;
          for (var i = 0; i < name.length; i++)
            hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
          return palette[hash % palette.length];
        }

          el.textContent = isGroup ? "#" : initials(name);
          if (!isGroup) {
            var cached = profileCache.get(name);
            if (cached && cached.avatar) {
              el.textContent = "";
              var img = document.createElement("img");
              img.src = cached.avatar;
              img.alt = "";
              el.appendChild(img);
            } else {
              fetchProfile(name);

          return el;
        }
        function timeNow() {
