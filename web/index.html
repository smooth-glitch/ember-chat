        // ---- outgoing-message acks: delivery/read ticks (DMs) + id assignment (all scopes) ----
        // Every server-side send command (/msg, /groupmsg, plain broadcast) is
        // processed one frame at a time, synchronously, in the order it arrived
        // (see chat_web:handle_ws_data) -- so acks for a given conversation always
        // arrive in the same order the messages were sent. That lets a plain FIFO
        // queue per conversation match an incoming ack to the right bubble/message
        // object, with no need to invent and thread a client-generated id through
        // the wire protocol for the outbound half of the round trip.
        function queuePendingDelivery(convKey, row, msg) {
          if (!row || !msg) return;
          if (!pendingDelivery.has(convKey)) pendingDelivery.set(convKey, []);
          pendingDelivery.get(convKey).push({ row: row, msg: msg });
        }
        // opts: { status } for a DM delivery/read tick, and/or { id } once the
        // server has assigned this message a durable id (needed before it can be
        // reacted to, or receive reactions from others).
        function resolvePendingDelivery(convKey, opts) {
          var queue = pendingDelivery.get(convKey);
          if (!queue || queue.length === 0) return;
          var entry = queue.shift();
          if (opts.status) {
            entry.msg.status = opts.status;
            setTickStatus(entry.row, opts.status);
          }
          if (opts.id !== undefined) {
            entry.msg.id = opts.id;
            messagesById.set(opts.id, { convKey: convKey, msg: entry.msg });
            attachReactTrigger(entry.row, entry.msg, convKey);
          }
        }
        function setTickStatus(row, status) {
          if (!row) return;
          var el = row.querySelector(".ticks");
          if (!el) return;
          var delivered = status === "delivered" || status === "read";
          el.textContent = delivered ? "✓✓" : "✓";
          el.classList.toggle("read", status === "read");
        }
        function sendReadReceipt(conv) {
          if (conv.type === "dm") wsSend("/read dm " + conv.title);
        }
        function markConversationRead(dmKey) {
          var conv = conversations.get(dmKey);
          if (!conv) return;
          conv.messages.forEach(function (m) {
            if (m.out) m.status = "read";
          });
          if (dmKey === activeKey) {
            Array.from(messagesEl.querySelectorAll(".row.out .ticks")).forEach(
              function (el) {
                el.textContent = "✓✓";
                el.classList.add("read");
              },
            );
          }
        }

        // ---- reactions ----
        // A message can only be reacted to once the server has assigned it a
        // durable id -- for anything the current user just sent, that arrives a
        // beat after the optimistic render (see resolvePendingDelivery); for
        // anything received live or loaded from history, the id is already there.
        function attachReactTrigger(row, msg, convKey) {
          if (!row || row.querySelector(".react-trigger")) return;
          row.dataset.msgId = msg.id;
          var bubble = row.querySelector(".msg");
          if (!bubble) return;
          var trigger = document.createElement("button");
          trigger.type = "button";
          trigger.className = "react-trigger";
          trigger.setAttribute("aria-label", "React to this message");
          trigger.textContent = "\u{1F642}";
          trigger.addEventListener("click", function (e) {
            e.stopPropagation();

          replyTrigger.type = "button";

          if (msg.preview) renderLinkPreviewCard(bubble, msg.preview);
          renderReactionPills(bubble, msg, convKey);
        }

        function renderReactionPills(bubble, msg, convKey) {
          var existing = bubble.querySelector(".reactions");
          if (existing) existing.remove();
          if (!msg.reactions || msg.reactions.length === 0) return;
          var counts = new Map(); // emoji -> { count, mine }
          msg.reactions.forEach(function (r) {
            var entry = counts.get(r.emoji) || { count: 0, mine: false };
            entry.count++;
            if (r.user === myName) entry.mine = true;
            counts.set(r.emoji, entry);
          });
          var wrap = document.createElement("div");
          wrap.className = "reactions";
          counts.forEach(function (entry, emoji) {
            var pill = document.createElement("button");
            pill.type = "button";
            pill.className = "reaction-pill" + (entry.mine ? " mine" : "");
            pill.textContent = emoji + " " + entry.count;
            pill.title = entry.mine
              ? "Remove your " + emoji + " reaction"
              : "React with " + emoji;
            pill.addEventListener("click", function (e) {
              e.stopPropagation();
              sendReact(convKey, msg, emoji);
            });
            wrap.appendChild(pill);
          });
          bubble.appendChild(wrap);
        }

        function sendReact(convKey, msg, emoji) {
          if (msg.id === undefined) return; // still waiting on the send ack -- ignore the tap
          var conv = conversations.get(convKey);
          if (!conv) return;
          if (conv.type === "global")
            wsSend("/react global " + msg.id + " " + emoji);
          else if (conv.type === "dm")
            wsSend("/react dm " + conv.title + " " + msg.id + " " + emoji);
          else if (conv.type === "group")
            wsSend("/react group " + conv.title + " " + msg.id + " " + emoji);
        }

        // Delete-for-everyone -- the server re-checks that this client is
        // actually the original sender before honoring it (see
        // chat_store:delete_message/2), this client-side gate just keeps
        // the option from showing on messages that would be rejected anyway.
        function sendDelete(convKey, msg) {
          if (msg.id === undefined) return;
          var conv = conversations.get(convKey);
          if (!conv) return;
          if (conv.type === "global") wsSend("/delete global " + msg.id);
          else if (conv.type === "dm")
            wsSend("/delete dm " + conv.title + " " + msg.id);
          else if (conv.type === "group")
            wsSend("/delete group " + conv.title + " " + msg.id);
        }

        function applyMessageDeleted(messageId) {
          var entry = messagesById.get(messageId);
          if (!entry) return;
          entry.msg.deleted = true;
          entry.msg.text = "";
          entry.msg.reactions = [];
          if (entry.convKey !== activeKey) return;
          var row = messagesEl.querySelector(
            '[data-msg-id="' + messageId + '"]',

          placeholder.className = "deleted-msg";
          placeholder.textContent = "This message was deleted";
          bubble.appendChild(placeholder);
        }

        function applyReactionUpdate(messageId, reactions) {
          var entry = messagesById.get(messageId);
          if (!entry) return; // reaction on a message this client never loaded (e.g. from before it joined) -- nothing to update
          entry.msg.reactions = reactions;

            '[data-msg-id="' + messageId + '"]',

        // ---- link previews ----

        function parsePreviewFromWire(data) {

            !data.previewDescription &&

            title: data.previewTitle || "",
            description: data.previewDescription || "",

        function closeQuickReact() {

            closeQuickReact();

        // together, see the "react to a message" UI this was modeled on.
        // messageActionsOpenedAt guards against the click that a touch's
        // pointerup can still synthesize right after a long-press --

        // frame it opened.

        }
        function openEmojiPickerForReaction(msg, convKey) {

          gifLoaded = false;
          stickerLoaded = false;
          switchTab("emoji");
          buildEmojiGrid("");
          emojiSearch.value = "";
          gifSearch.value = "";
          stickerSearch.value = "";
          contentPanel.classList.remove("hidden", "closing");
        }

          if (
            !quickReactPopup.classList.contains("hidden") &&
            !quickReactPopup.contains(e.target) &&
            !e.target.closest(".react-trigger")

            !messageActionMenu.classList.contains("hidden") &&

        // ---- long-press on a message: react + reply/copy together ----
        // Touch-only (mouse users already have the always-reachable hover
        // icons -- a long *mouse*-press has no equivalent native affordance
        // and would just feel like a stuck click). Cancels on any real
        // movement past MOVE_THRESHOLD so it doesn't fire mid-scroll.
        (function setupMessageLongPress() {
          if (!window.PointerEvent) return;
          var HOLD_MS = 450;
          var MOVE_THRESHOLD = 10;
          var timer = null;
          var startX = 0,
            startY = 0;
          var pointerId = null;
          function cancel() {
            if (timer) {
              clearTimeout(timer);
              timer = null;
            }
            pointerId = null;
          }
          function onDown(e) {
            if (e.pointerType === "mouse") return;
            if (
              e.target.closest(
                ".reply-quote, a, button, audio, .reactions, .react-trigger, .reply-trigger",
              )
            )
              return;
            var bubble = e.target.closest(".msg");
            var row = bubble && bubble.closest(".row");
            if (!bubble || !row || !row.dataset.msgId) return;
            startX = e.clientX;
            startY = e.clientY;
            pointerId = e.pointerId;
            timer = setTimeout(function () {
              timer = null;
              var entry = messagesById.get(Number(row.dataset.msgId));
              if (!entry) return;
              if (navigator.vibrate) {
                try {
                  navigator.vibrate(10);
                } catch (e2) {
                  /* not supported on this device -- purely a nice-to-have */
                }
              }
              openMessageActions(bubble, entry.msg, entry.convKey);
            }, HOLD_MS);
          }
          function onMove(e) {
            if (pointerId === null || e.pointerId !== pointerId) return;
            if (
              Math.abs(e.clientX - startX) > MOVE_THRESHOLD ||
              Math.abs(e.clientY - startY) > MOVE_THRESHOLD
            ) {
              cancel();
            }
          }
          function onUpOrCancel(e) {
            if (pointerId === null || e.pointerId !== pointerId) return;
            cancel();
          }
          messagesEl.addEventListener("pointerdown", onDown);
          messagesEl.addEventListener("pointermove", onMove);
          messagesEl.addEventListener("pointerup", onUpOrCancel);
          messagesEl.addEventListener("pointercancel", onUpOrCancel);
        })();

        // ---- swipe-to-reply (touch) ----
        // Same pending/horizontal-intent disambiguation as the sidebar
        // drawer's swipe (see setupSidebarSwipe) and the same pattern for
        // guarding against a drag interrupted mid-gesture (tab backgrounded
        // mid-swipe) via visibilitychange -- copied rather than shared
        // because the two gestures act on different elements with
        // different reset targets (a row springs back to 0, the drawer
        // springs to one of two fixed endpoints).
        (function setupSwipeToReply() {
          if (!window.PointerEvent) return;
          var DRAG_THRESHOLD = 10;
          var TRIGGER_DISTANCE = 64;
          var MAX_DRAG = 84;
          var mode = null; // null | "pending" | "horizontal"
          var pointerId = null;
          var startX = 0,
            startY = 0;
          var activeRow = null;
          var activeIcon = null;

          function rubberband(overshoot, dimension) {
            var c = 0.55;
            return (
              (overshoot * dimension * c) /
              (dimension + c * Math.abs(overshoot))
            );
          }
          function clamp(px) {
            if (px <= 0) return 0;
            if (px > MAX_DRAG)
              return MAX_DRAG + rubberband(px - MAX_DRAG, MAX_DRAG);
            return px;
          }
          function ensureIcon(row) {
            var icon = row.querySelector(".swipe-reply-icon");
            if (!icon) {
              icon = document.createElement("div");
              icon.className = "swipe-reply-icon";
              icon.textContent = "↩";
              row.appendChild(icon);
            }
            return icon;
          }
          function setLive(row, icon, px) {
            row.style.transform = "translateX(" + px + "px)";
            var progress = Math.min(1, px / TRIGGER_DISTANCE);
            icon.style.opacity = String(progress);
            icon.style.transform = "scale(" + (0.6 + 0.4 * progress) + ")";
            icon.classList.toggle("ready", px >= TRIGGER_DISTANCE);
          }
          function endDrag(row, icon, triggered) {
            row.classList.remove("swiping");
            row.classList.add("swipe-reset");
            row.style.transform = "";
            if (icon) {
              icon.style.opacity = "";
              icon.style.transform = "";
              icon.classList.remove("ready");
            }
            setTimeout(function () {
              row.classList.remove("swipe-reset");
            }, 200);
            if (triggered) {
              var msgId = row.dataset.msgId;
              var entry = msgId ? messagesById.get(Number(msgId)) : null;
              if (entry) startReply(entry.convKey, entry.msg);
            }
          }

            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            document.removeEventListener("pointercancel", onUp);
            document.removeEventListener("visibilitychange", onVisibility);
          }
          function onDown(e) {
            if (e.pointerType === "mouse") return;
            if (
              e.target.closest(
                ".reply-quote, a, button, audio, .reactions, .react-trigger, .reply-trigger",
              )
            )
              return;
            var row = e.target.closest(".row");
            if (!row || !row.dataset.msgId) return;
            mode = "pending";
            pointerId = e.pointerId;
            startX = e.clientX;
            startY = e.clientY;
            activeRow = row;
            activeIcon = null;
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
            document.addEventListener("pointercancel", onUp);
            document.addEventListener("visibilitychange", onVisibility);
          }
          function onMove(e) {
            if (mode === null || e.pointerId !== pointerId) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;
            if (mode === "pending") {
              if (dx > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
                mode = "horizontal";
                activeIcon = ensureIcon(activeRow);
                activeRow.classList.add("swiping");
              } else if (
                Math.abs(dy) > DRAG_THRESHOLD ||
                dx < -DRAG_THRESHOLD
              ) {
                mode = null;
                teardown();
                return;
              } else {
                return;
              }
            }
            if (mode !== "horizontal") return;
            e.preventDefault();
            setLive(activeRow, activeIcon, clamp(dx));
          }
          function onUp(e) {
            if (pointerId !== e.pointerId) return;
            teardown();
            if (mode === "horizontal" && activeRow) {
              var dx = e.clientX - startX;
              endDrag(activeRow, activeIcon, dx >= TRIGGER_DISTANCE);
            }
            mode = null;
            pointerId = null;
            activeRow = null;
            activeIcon = null;
          }
          // Mirrors the sidebar drawer's own visibilitychange safeguard --
          // a drag interrupted by backgrounding the tab (app switch, a
          // notification, a call) mid-swipe must still resolve cleanly
          // instead of leaving the row stuck at a partial offset with its
          // listeners leaked.
          function onVisibility() {
            if (document.hidden && mode !== null) {
              teardown();
              if (mode === "horizontal" && activeRow) {
                endDrag(activeRow, activeIcon, false);
              }
              mode = null;
              pointerId = null;
              activeRow = null;
              activeIcon = null;
            }
          }
          messagesEl.addEventListener("pointerdown", onDown);
        })();

        // ---- typing indicators ----
        function showTyping(convKey, username) {
          if (!typingTimers.has(convKey)) typingTimers.set(convKey, new Map());
          var userTimers = typingTimers.get(convKey);
          if (userTimers.has(username)) clearTimeout(userTimers.get(username));
          userTimers.set(
            username,
            setTimeout(function () {
              userTimers.delete(username);
              if (convKey === activeKey) renderTopbar();
            }, 3000),
          );
          if (convKey === activeKey) renderTopbar();
        }
        function typingUsersFor(convKey) {
          var userTimers = typingTimers.get(convKey);
          return userTimers ? Array.from(userTimers.keys()) : [];
        }

        // ---- desktop notifications + unread badge ----
        var faviconLink = document.getElementById("favicon");
        var faviconCanvas = document.createElement("canvas");
        faviconCanvas.width = 64;
        faviconCanvas.height = 64;
        var faviconCtx = faviconCanvas.getContext("2d");
        function roundedSquarePath(ctx, x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
        function drawFavicon(showBadge) {
          if (!faviconCtx) return;
          var ctx = faviconCtx;
          ctx.clearRect(0, 0, 64, 64);
          var grad = ctx.createLinearGradient(0, 0, 64, 64);
          grad.addColorStop(0, "#5856d6");
          grad.addColorStop(1, "#7a78e0");
          roundedSquarePath(ctx, 4, 4, 56, 56, 16);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 34px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("\u{1F525}", 32, 34);
          if (showBadge) {
            ctx.beginPath();
            ctx.arc(50, 14, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#d70015";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
          }
          if (faviconLink)
            faviconLink.href = faviconCanvas.toDataURL("image/png");
        }
        function updateUnreadIndicators() {
          var total = 0;
          conversations.forEach(function (c) {
            total += c.unread;
          });
          document.title =
            total > 0
              ? "(" + (total > 99 ? "99+" : total) + ") " + totalUnreadTitle
              : totalUnreadTitle;
          drawFavicon(total > 0);
        }
        function requestNotificationPermissionOnce() {
          if (!("Notification" in window)) return;
          if (Notification.permission === "default") {
            try {
              Notification.requestPermission();
            } catch (e) {
              /* ignore */
            }
          }
        }
        function notifyNewMessage(conv, msg) {
          if (
            !("Notification" in window) ||
            Notification.permission !== "granted"
          )
            return;
          try {
            var n = new Notification(
              msg.fromLabel || conv.title || "New message",
              {
                body: msg.text,
                tag: "ember-" + (conv ? conv.title : ""),

          }

        // ---- conversations ----
        // Global history arrives unprompted right after "welcome" (see the
        // "history" case below); DM and group history is requested here, the
        // moment the client first learns that conversation exists, so it never
        // has to be asked for explicitly.
        function getOrCreateConversation(key, type, title, members) {
          var conv = conversations.get(key);
          var isNew = !conv;
          if (!conv) {
            conv = {
              type: type,
              title: title,
              messages: [],
              unread: 0,
              lastActivity: 0,
              members: members || null,
            };
            conversations.set(key, conv);
          }
          if (title) conv.title = title;
          if (members) conv.members = members;
          if (isNew && type === "dm") wsSend("/history dm " + title);
          else if (isNew && type === "group") wsSend("/history group " + title);
          return conv;
        }

        function isNearBottom() {
          return (
            messagesEl.scrollHeight -
              messagesEl.scrollTop -
              messagesEl.clientHeight <
            NEAR_BOTTOM_PX

        }
        function showJumpPill() {

        function hideJumpPill() {

        jumpLatestBtn.addEventListener("click", function () {
          scrollMessagesToBottom(true);

        messagesEl.addEventListener("scroll", function () {
          if (isNearBottom()) hideJumpPill();
        });

        function appendMessage(key, msg) {
          var conv = conversations.get(key);
          if (!conv) return null;
          conv.messages.push(msg);
          conv.lastActivity = Date.now();
          var row = null;
          var isViewingNow =
            key === activeKey &&
            document.visibilityState === "visible" &&
            document.hasFocus();
          if (key === activeKey) {
            // Read scroll position *before* inserting -- inserting grows scrollHeight,
            // which would make "was I at the bottom" always look false afterward.
            var wasNearBottom = isNearBottom();
            var prevMsg = conv.messages[conv.messages.length - 2];
            row = renderMessageRow(msg, true, isSameSender(msg, prevMsg), key);
            if (wasNearBottom || msg.out) {
              scrollMessagesToBottom(true);
              hideJumpPill();
            } else if (msg.kind !== "system") {
              // Don't yank someone back to "now" while they're reading history --
              // let them know new messages landed and let them choose to jump.
              showJumpPill();
            }
            if (!msg.out && conv.type === "dm" && isViewingNow)
              sendReadReceipt(conv);
          } else if (msg.kind !== "system") {
            conv.unread++;
          }
          if (msg.kind !== "system" && !msg.out && !isViewingNow) {
            notifyNewMessage(conv, msg);
          }

          updateUnreadIndicators();
          return row;
        }

        function switchConversation(key) {
          if (!conversations.has(key)) return;
          activeKey = key;
          var conv = conversations.get(key);
          conv.unread = 0;
          renderTopbar();
          renderMessagesFull();
          renderChatList();
          closeSidebar();
          hideJumpPill();
          updateUnreadIndicators();
          if (conv.type === "dm") sendReadReceipt(conv);
          renderReplyBanner(); // a pending reply only makes sense in the conversation it was started from
          msgInput.focus();
        }

        // ---- rendering: sidebar ----
        function chatSortValue(key, conv) {
          if (key === "global") return Infinity;
          return conv.lastActivity;
        }

        function renderChatList() {
          var entries = Array.from(conversations.entries()).sort(
            function (a, b) {
              return chatSortValue(b[0], b[1]) - chatSortValue(a[0], a[1]);
            },
          );

          chatList.innerHTML = "";
          entries.forEach(function ([key, conv]) {
            var li = document.createElement("li");
            li.className = "row-item" + (key === activeKey ? " active" : "");
            li.tabIndex = 0;
            li.setAttribute("role", "button");
            li.setAttribute("aria-label", conv.title);
            li.appendChild(makeAvatar(conv.title, conv.type === "group"));

            var meta = document.createElement("div");
            meta.className = "meta";
            var nameLine = document.createElement("div");
            nameLine.className = "name-line";
            var nameEl = document.createElement("span");
            nameEl.className = "name";
            nameEl.textContent = conv.title;
            nameLine.appendChild(nameEl);
            if (conv.lastActivity) {
              var timeEl = document.createElement("span");
              timeEl.className = "time";
              timeEl.textContent = new Date(
                conv.lastActivity,
              ).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
              nameLine.appendChild(timeEl);
            }
            meta.appendChild(nameLine);

            var last = conv.messages[conv.messages.length - 1];
            var preview = document.createElement("div");
            preview.className = "preview";
            preview.textContent = last
              ? (last.previewPrefix || "") + last.text

                : "No messages yet";
            meta.appendChild(preview);
            li.appendChild(meta);

            // Only pop the badge when unread genuinely increased since the last render --
            // this list is fully torn down and rebuilt on almost every event, so a naive
            // "always animate on mount" would replay the pop for every untouched chat too.
            var prevUnread = lastRenderedUnread.get(key) || 0;
            if (conv.unread > 0) {
              var badge = document.createElement("span");
              badge.className =
                "badge" + (conv.unread > prevUnread ? " pop" : "");
              badge.textContent =
                conv.unread > 99 ? "99+" : String(conv.unread);

            }
            lastRenderedUnread.set(key, conv.unread);

              switchConversation(key);
            });
            li.addEventListener("keydown", function (e) {

              }
            });

          });
        }

        function renderOnlineList() {
          onlineList.innerHTML = "";
          var others = onlineUsers.filter(function (u) {
            return u !== myName;
          });

          }
          others.forEach(function (u) {
            var li = document.createElement("li");

            li.tabIndex = 0;

            li.appendChild(makeAvatar(u, false));
            var meta = document.createElement("div");
            meta.className = "meta";
            var nameLine = document.createElement("div");
            nameLine.className = "name-line";
            var nameEl = document.createElement("span");
            nameEl.className = "name";
            nameEl.textContent = u;
            nameLine.appendChild(nameEl);
            meta.appendChild(nameLine);
            var sub = document.createElement("div");
            sub.className = "preview";
            var dot = document.createElement("span");
            dot.className = "dot";
            sub.appendChild(dot);
            sub.appendChild(document.createTextNode(" online"));
            meta.appendChild(sub);
            li.appendChild(meta);

        // ---- rendering: topbar + messages ----
        function renderTopbar() {
          var conv = conversations.get(activeKey);
          if (!conv) return;
          topbarTitle.textContent = conv.title;
          membersBtn.classList.toggle("hidden", conv.type !== "group");
          var typing = typingUsersFor(activeKey);
          if (typing.length > 0) {
            topbarSub.textContent =
              typing.length === 1
                ? typing[0] + " is typing…"
                : "Several people are typing…";
            return;
          }
          if (conv.type === "global") {
            topbarSub.textContent = "everyone in the room sees this";
          } else if (conv.type === "dm") {
            topbarSub.textContent =
              onlineUsers.indexOf(conv.title) !== -1 ? "online" : "offline";
          } else {
            topbarSub.textContent = (conv.members || []).length + " members";

        // MediaRecorder's WebM output is an unseekable stream -- it never
        // writes a Duration element into the container, since the browser
        // doesn't know the final length until recording stops. Chromium and
        // WebKit both leave `duration` as Infinity/NaN forever as a result,
        // so every voice note would show "0:00" even while playing. Seeking
        // to a huge timestamp forces the browser to scan to the real end of
        // the stream and recompute the true duration as a side effect --
        // the standard workaround for this well-known MediaRecorder gap.
        function fixWebmDuration(audio) {
          audio.addEventListener(
            "loadedmetadata",
            function () {
              if (audio.duration !== Infinity && !isNaN(audio.duration)) return;
              function onTimeUpdate() {
                audio.removeEventListener("timeupdate", onTimeUpdate);
                audio.currentTime = 0;
              }
              audio.addEventListener("timeupdate", onTimeUpdate);
              audio.currentTime = 1e101;
            },
            { once: true },
          );
        }

        function renderMessageContent(bubble, text) {
          if (GIF_RE.test(text.trim())) {
            bubble.classList.add("image-msg");
            var link = document.createElement("a");
            link.href = text.trim();
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            var img = document.createElement("img");
            img.src = text.trim();
            img.loading = "lazy";
            img.alt = "shared image";
            link.appendChild(img);
            bubble.appendChild(link);
          } else if (AUDIO_RE.test(text.trim())) {
            bubble.classList.add("audio-msg");
            var audio = document.createElement("audio");
            audio.controls = true;
            audio.preload = "metadata";
            audio.src = text.trim();
            fixWebmDuration(audio);
            bubble.appendChild(audio);
          } else {
            bubble.appendChild(document.createTextNode(text));
          }
        }

        // Two rows are "grouped" -- same speaker, rendered close together with
        // the avatar/name shown only once -- when neither is a system line and
        // they're both outgoing, or both incoming from the same person. A system
        // message (join/leave/group notice) always breaks a group, since it's a
        // natural conversation break.
        function isSameSender(a, b) {
          if (!a || !b) return false;
          if (a.kind === "system" || b.kind === "system") return false;
          if (a.out !== b.out) return false;
          return a.out || a.from === b.from;
        }

        // `live` (default true) marks a message that just arrived, so it gets the
        // entrance animation. Bulk history redraws (renderMessagesFull) pass
        // live:false so switching chats doesn't replay a cascading fade-in for
        // every message that was already there. `grouped` suppresses the repeated
        // avatar/name for a run of messages from the same sender (see isSameSender).
        // Reads the quoted original purely from this client's own cache (see
        // the "reply-to" section below for why the server never sends more
        // than the id) -- if it's not there (e.g. it's older than this
        // client's history window), falls back to a neutral placeholder
        // rather than showing nothing or an error.
        // A reply's quoted snippet used to always show raw message text --
        // for a GIF/sticker/photo reply, that text IS the bare media URL, so
        // the quote showed a long unreadable link instead of anything
        // resembling the original (reported: "there is only a URL in the
        // reply"). Detect the same GIF_RE/AUDIO_RE this file already uses to
        // render bare-media messages inline, and give the quote a small
        // thumbnail + type label instead, iMessage/WhatsApp-style.
        function replyQuoteMediaKind(text) {
          var t = String(text).trim();
          if (GIF_RE.test(t)) return /\.gif(\?|$)/i.test(t) ? "gif" : "photo";
          if (AUDIO_RE.test(t)) return "audio";
          return null;
        }
        function buildReplyQuoteBody(text) {
          var kind = replyQuoteMediaKind(text);
          var body = document.createElement("div");
          if (kind === "gif" || kind === "photo") {
            body.className = "reply-quote-media";
            var thumb = document.createElement("img");
            thumb.className = "reply-quote-thumb";
            thumb.src = text.trim();
            thumb.loading = "lazy";
            thumb.alt = "";
            var label = document.createElement("span");
            label.className = "reply-quote-media-label";
            label.textContent = kind === "gif" ? "GIF" : "Photo";
            body.appendChild(label);
            body.appendChild(thumb);
          } else if (kind === "audio") {
            body.className = "reply-quote-media reply-quote-media-audio";
            var label2 = document.createElement("span");
            label2.className = "reply-quote-media-label";
            label2.textContent = "\u{1F3A4} Voice note";
            body.appendChild(label2);
          } else {
            body.className = "reply-quote-text";
            body.textContent = truncateForQuote(text);
          }
          return body;
        }
        function renderReplyQuote(bubble, replyToId) {
          var quote = document.createElement("div");
          quote.className = "reply-quote";
          var entry = messagesById.get(replyToId);
          var fromEl = document.createElement("div");
          fromEl.className = "reply-quote-from";
          var textEl;
          if (entry) {
            fromEl.textContent = entry.msg.out ? myName : entry.msg.from;
            textEl = buildReplyQuoteBody(entry.msg.text);
          } else {
            fromEl.textContent = "Original message";
            textEl = document.createElement("div");
            textEl.className = "reply-quote-text";
            textEl.textContent = "Not available";
          }
          quote.appendChild(fromEl);
          quote.appendChild(textEl);
          quote.addEventListener("click", function (e) {
            e.stopPropagation();
            var target = messagesEl.querySelector(
              '[data-msg-id="' + replyToId + '"]',
            );
            if (!target) return;
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            target.classList.add("flash");
            setTimeout(function () {
              target.classList.remove("flash");
            }, 900);
          });
          bubble.appendChild(quote);
        }

        function renderMessageRow(msg, live, grouped, convKey) {
          if (live === undefined) live = true;
          document.getElementById("empty-conversation") &&
            document.getElementById("empty-conversation").remove();
          if (msg.kind === "system") {
            var line = document.createElement("div");
            line.className = "system-line" + (live ? " enter" : "");
            line.textContent = msg.text;
            messagesEl.appendChild(line);
            return null;
          }
          var row = document.createElement("div");
          row.className =
            "row " +
            (msg.out ? "out" : "in") +
            (live ? " enter" : "") +
            (grouped ? " grouped" : "");
          if (grouped) {
            var spacer = document.createElement("div");
            spacer.className = "avatar-spacer";
            row.appendChild(spacer);
          } else {
            row.appendChild(makeAvatar(msg.out ? myName : msg.from, false));
          }
          var bubble = document.createElement("div");
          bubble.className =
            "msg " + (msg.out ? "out" : "in") + (msg.private ? " private" : "");
          if (!msg.out)
            bubble.style.setProperty("--sender-color", avatarColor(msg.from));
          if (!grouped && msg.fromLabel) {
            var fromEl = document.createElement("span");
            fromEl.className = "from";
            fromEl.textContent = msg.fromLabel;
            bubble.appendChild(fromEl);
          }
          if (msg.deleted) {
            var placeholder = document.createElement("span");
            placeholder.className = "deleted-msg";
            placeholder.textContent = "This message was deleted";
            bubble.appendChild(placeholder);
          } else {
            if (msg.replyTo) renderReplyQuote(bubble, msg.replyTo);
            renderMessageContent(bubble, msg.text);
            if (msg.out && msg.private) {
              var ticks = document.createElement("span");
              var delivered = msg.status === "delivered" || msg.status === "read";
              ticks.className = "ticks" + (msg.status === "read" ? " read" : "");
              ticks.textContent = delivered ? "✓✓" : "✓";
              bubble.appendChild(ticks);
            }
          }
          row.appendChild(bubble);
          messagesEl.appendChild(row);
          if (!msg.deleted && msg.id !== undefined && convKey)
            attachReactTrigger(row, msg, convKey);
          return row;
        }

        function renderMessagesFull() {
          var conv = conversations.get(activeKey);
          messagesEl.innerHTML = "";
          if (!conv || conv.messages.length === 0) {
            var empty = document.createElement("div");
            empty.id = "empty-conversation";
            empty.textContent =
              conv && conv.type === "global"
                ? "This is the group chat everyone shares. Say hello!"
                : "No messages yet. Say hello!";
            messagesEl.appendChild(empty);
            scrollMessagesToBottom(false);
            return;
          }
          conv.messages.forEach(function (m, i) {
            renderMessageRow(
              m,
              false,
              isSameSender(m, conv.messages[i - 1]),
              activeKey,
            );
          });
          scrollMessagesToBottom(false);
        }

        function scrollMessagesToBottom(smooth) {
          if (smooth)
            messagesEl.scrollTo({
              top: messagesEl.scrollHeight,
              behavior: "smooth",
            });
          else messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ---- sidebar mobile drawer ----
        function openSidebar() {
          sidebar.classList.add("open");
          backdrop.classList.add("show");
        }
        function closeSidebar() {
          sidebar.classList.remove("open");
          backdrop.classList.remove("show");
        }
        menuBtn.addEventListener("click", openSidebar);
        sidebarClose.addEventListener("click", closeSidebar);
        backdrop.addEventListener("click", closeSidebar);

        // ---- sidebar swipe-to-close (mobile) ----
        // A real 1:1 drag with rubber-band resistance and a velocity-aware settle,
        // per the fluid-interfaces gesture principles: track the finger exactly,
        // then hand off release velocity into a spring rather than a fixed-duration
        // animation so a fast flick actually closes faster than a slow drag.
        (function setupSidebarSwipe() {
          if (!window.PointerEvent) return;
          var DRAG_THRESHOLD = 10;
          var mode = null; // null | "pending" | "horizontal"
          var pointerId = null;
          var startX = 0,
            startY = 0;
          var history = [];
          var sidebarWidth = 320;
          var rafId = null;

          function mobileActive() {
            return window.matchMedia("(max-width: 820px)").matches;
          }

          function rubberband(overshoot, dimension) {
            var c = 0.55;
            return (
              (overshoot * dimension * c) /
              (dimension + c * Math.abs(overshoot))
            );
          }
          function clamp(px) {
            if (px > 0) return rubberband(px, sidebarWidth);
            if (px < -sidebarWidth)
              return (
                -sidebarWidth - rubberband(-(px + sidebarWidth), sidebarWidth)
              );
            return px;
          }
          function setLive(px) {
            sidebar.style.transform = "translateX(" + px + "px)";
            var openness = Math.max(0, Math.min(1, 1 + px / sidebarWidth));
            backdrop.style.display = "block";
            backdrop.style.opacity = String(openness);
          }
          function clearInline() {
            sidebar.style.transform = "";
            backdrop.style.opacity = "";
            backdrop.style.display = "";
          }
          function project(v) {
            var d = 0.998;
            return ((v / 1000) * d) / (1 - d);
          }
          // Analytic damped-harmonic-oscillator solution (Apple's damping-ratio /
          // response parameterization) -- exact and stable, no per-frame drift.
          function springValueAt(x0, v0, target, dampingRatio, response, t) {
            var omega0 = (2 * Math.PI) / response;
            var decay = Math.exp(-dampingRatio * omega0 * t);
            var a = x0 - target;
            if (dampingRatio < 1) {
              var omegaD = omega0 * Math.sqrt(1 - dampingRatio * dampingRatio);
              var b = (v0 + dampingRatio * omega0 * a) / omegaD;
              return (
                target +
                decay * (a * Math.cos(omegaD * t) + b * Math.sin(omegaD * t))
              );
            }
            var b2 = v0 + omega0 * a;
            return target + decay * (a + b2 * t);
          }
          function cancelSpring() {
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }
          function settle(open, velocity) {
            cancelSpring();
            var x0 = sidebar.getBoundingClientRect().left;
            var target = open ? 0 : -sidebarWidth;
            var dampingRatio = open ? 0.86 : 0.92;
            var response = 0.32;
            sidebar.classList.add("dragging");
            var start = null;
            function frame(now) {
              if (start === null) start = now;
              var t = (now - start) / 1000;
              setLive(
                springValueAt(x0, velocity, target, dampingRatio, response, t),
              );
              if (t > response * 4) {
                setLive(target);
                sidebar.classList.remove("dragging");
                clearInline();
                sidebar.classList.toggle("open", open);
                backdrop.classList.toggle("show", open);
                rafId = null;
                return;
              }
              rafId = requestAnimationFrame(frame);
            }
            rafId = requestAnimationFrame(frame);
          }
          function velocityFromHistory() {
            if (history.length < 2) return 0;
            var newest = history[history.length - 1];
            var cutoff = newest.t - 80;
            var oldest = newest;
            for (var i = history.length - 1; i >= 0; i--) {
              oldest = history[i];
              if (history[i].t < cutoff) break;
            }
            var dt = (newest.t - oldest.t) / 1000;
            if (dt <= 0) return 0;
            return (newest.x - oldest.x) / dt;
          }

          function onDown(e) {
            if (!mobileActive() || !sidebar.classList.contains("open")) return;
            if (e.pointerType === "mouse" && e.button !== 0) return;
            mode = "pending";
            pointerId = e.pointerId;
            startX = e.clientX;
            startY = e.clientY;
            sidebarWidth = sidebar.offsetWidth || 320;
            history = [{ x: e.clientX, t: e.timeStamp }];
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
            document.addEventListener("pointercancel", onUp);
          }
          function onMove(e) {
            if (mode === null || e.pointerId !== pointerId) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;
            if (mode === "pending") {
              if (
                Math.abs(dx) > DRAG_THRESHOLD &&
                Math.abs(dx) > Math.abs(dy) * 1.5
              ) {
                mode = "horizontal";
                cancelSpring();
                sidebar.classList.add("dragging");
              } else if (Math.abs(dy) > DRAG_THRESHOLD) {
                mode = null; // vertical intent -- hand it back to native list scrolling
                return;
              } else {
                return;
              }
            }
            if (mode !== "horizontal") return;
            setLive(clamp(dx));
            history.push({ x: e.clientX, t: e.timeStamp });
            if (history.length > 8) history.shift();
          }
          function onUp(e) {
            if (pointerId !== e.pointerId) return;
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            document.removeEventListener("pointercancel", onUp);
            if (mode === "horizontal") {
              var velocity = velocityFromHistory();
              var currentX = sidebar.getBoundingClientRect().left;
              var projected = currentX + project(velocity);
              var shouldOpen = projected > -sidebarWidth / 2;
              if (Math.abs(velocity) > 400) shouldOpen = velocity > 0;
              settle(shouldOpen, velocity);
            }
            mode = null;
            pointerId = null;
          }
          sidebar.addEventListener("pointerdown", onDown);

          // A real device can interrupt a drag before pointerup/pointercancel
          // ever fires -- backgrounding the tab mid-swipe (switching apps, a
          // notification pull-down, an incoming call). Without this, `mode`
          // and the pointermove/pointerup listeners would leak, and the
          // sidebar could be left stranded at whatever partial position the
          // last onMove frame set, with neither the "open" class nor a
          // finished transition ever committed. Snap it to the nearer end
          // and tear down cleanly instead of leaving it dangling.
          document.addEventListener("visibilitychange", function () {
            if (document.hidden && mode !== null) {
              document.removeEventListener("pointermove", onMove);
              document.removeEventListener("pointerup", onUp);
              document.removeEventListener("pointercancel", onUp);
              if (mode === "horizontal") {
                var currentX = sidebar.getBoundingClientRect().left;
                settle(currentX > -sidebarWidth / 2, 0);
              }
              mode = null;
              pointerId = null;
            }
          });
        })();

            !text ||

        // ---- reply-to ----
        // Only the id travels to the server (see chat_store:save_message/6);
        // the quoted snippet shown here and in renderReplyQuote is read
        // straight from this client's own messagesById cache, since the
        // message being replied to is already rendered right there on
        // screen -- no reason to have the server echo it back.
        function truncateForQuote(text) {
          var t = String(text);
          return t.length > 80 ? t.slice(0, 80) + "…" : t;
        }
        function startReply(convKey, msg) {
          if (msg.id === undefined) return; // no durable id yet -- can't be a reply target
          replyingTo = {
            convKey: convKey,
            id: msg.id,
            from: msg.out ? myName : msg.from,
            // Full, untruncated text -- buildReplyQuoteBody needs the real
            // trailing file extension to detect a GIF/photo/voice-note
            // reply (truncateForQuote's 80-char cutoff would otherwise
            // chop it off a long CDN URL and silently fall back to
            // rendering it as plain text). Truncation for the plain-text
            // case happens inside buildReplyQuoteBody itself.
            text: msg.text,
          };
