          msgInput.focus();
        }
        function cancelReply() {
          replyingTo = null;
          renderReplyBanner();
        }
        function renderReplyBanner() {
          if (!replyingTo || replyingTo.convKey !== activeKey) {
            replyBanner.classList.add("hidden");
            return;
          }
          replyBannerFrom.textContent = replyingTo.from;
          replyBannerText.innerHTML = "";
          replyBannerText.appendChild(buildReplyQuoteBody(replyingTo.text));
          replyBanner.classList.remove("hidden");
        }
        replyBannerCancel.addEventListener("click", cancelReply);

        // Shared by doSend (typed text) and the image-upload flow (the resulting
        // URL, which the existing GIF_RE detection already renders as an inline
        // image -- no separate "image message" type needed anywhere in the app).
        // A pending reply (see startReply/cancelReply) is consumed here so any
        // message send -- typed, an uploaded image, a picked GIF/sticker -- can
        // carry it; the reply banner clears right after, matching the
        // one-reply-per-send behavior of WhatsApp/Telegram.
        function sendText(text) {
          var conv = conversations.get(activeKey);
          if (!conv) return;
          var replyId =
            replyingTo && replyingTo.convKey === activeKey
              ? replyingTo.id
              : null;
          var base = { out: true, text: text, reactions: [] };
          if (replyId !== null) base.replyTo = replyId;
          if (conv.type === "global") {
            var globalRow = appendMessage("global", base);
            queuePendingDelivery(
              "global",
              globalRow,
              conv.messages[conv.messages.length - 1],
            );
            wsSend(replyId !== null ? "/reply " + replyId + " " + text : text);
          } else if (conv.type === "dm") {
            base.private = true;
            var row = appendMessage(activeKey, base);
            queuePendingDelivery(
              activeKey,
              row,
              conv.messages[conv.messages.length - 1],
            );
            wsSend(
              replyId !== null
                ? "/replydm " + conv.title + " " + replyId + " " + text
                : "/msg " + conv.title + " " + text,
            );
          } else if (conv.type === "group") {
            var groupRow = appendMessage(activeKey, base);
            queuePendingDelivery(
              activeKey,
              groupRow,
              conv.messages[conv.messages.length - 1],
            );
            wsSend(
              replyId !== null
                ? "/replygroup " + conv.title + " " + replyId + " " + text
                : "/groupmsg " + conv.title + " " + text,
            );
          }
          if (replyId !== null) cancelReply();
        }

        // ---- image upload ----
        var MAX_UPLOAD_SIZE = 8 * 1024 * 1024;
        var ALLOWED_UPLOAD_TYPES = [
          "image/png",
          "image/jpeg",
          "image/gif",
          "image/webp",
        ];
        var cameraBtn = document.getElementById("camera-btn");
        var cameraFileInput = document.getElementById("camera-file-input");
        attachBtn.addEventListener("click", function () {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          attachFileInput.click();
        });
        // Same upload path as the gallery attach button -- the only
        // difference is the file input's `capture="environment"` attribute,
        // which on a phone opens the camera directly instead of the photo
        // library. Desktop browsers just ignore `capture` and fall back to
        // an ordinary file picker, so this is a safe, real feature (not a
        // no-op) rather than a decorative icon with nothing behind it.
        cameraBtn.addEventListener("click", function () {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          cameraFileInput.click();
        });
        function handlePickedImageFile(fileInput) {
          var file = fileInput.files && fileInput.files[0];
          fileInput.value = ""; // allow re-selecting the same file later
          if (!file) return;
          if (ALLOWED_UPLOAD_TYPES.indexOf(file.type) === -1) {
            toast("Only PNG, JPEG, GIF, or WebP images are supported.", true);
            return;
          }
          if (file.size > MAX_UPLOAD_SIZE) {
            toast("That image is too large (max 8 MB).", true);
            return;
          }
          uploadAndSend(file);
        }
        attachFileInput.addEventListener("change", function () {
          handlePickedImageFile(attachFileInput);
        });
        cameraFileInput.addEventListener("change", function () {
          handlePickedImageFile(cameraFileInput);
        });
        function uploadAndSend(file) {
          uploadBlobAndSend(file, file.name, attachBtn);
        }

        // Shared by the image-attach flow above and the voice-note recorder
        // below -- both just need to PUT a blob to /upload and, on success,
        // send the resulting URL as a normal message (GIF_RE/AUDIO_RE on the
        // receiving end decide how it renders, so nothing else here needs to
        // know or care which kind of file this is).
        function uploadBlob(blob, filename, busyBtn) {
          if (busyBtn) busyBtn.disabled = true;
          var form = new FormData();
          form.append("file", blob, filename);
          return fetch("/upload", { method: "POST", body: form })
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                toast(result.data.error || "Upload failed.", true);
                return null;
              }
              return location.origin + result.data.url;
            })
            .catch(function () {
              toast("Upload failed -- check your connection.", true);
              return null;
            })
            .finally(function () {
              if (busyBtn) busyBtn.disabled = false;
            });
        }
        function uploadBlobAndSend(blob, filename, busyBtn) {
          return uploadBlob(blob, filename, busyBtn).then(function (url) {
            if (url) sendText(url);
          });
        }

        // ---- voice notes ----
        // Recording happens entirely client-side via MediaRecorder; the
        // result is just another uploaded file (see uploadBlobAndSend above)
        // -- the server has no special "voice note" concept, only files and
        // messages whose text happens to be a URL ending in an audio
        // extension (see AUDIO_RE / renderMessageContent).
        var MAX_RECORDING_MS = 3 * 60 * 1000; // voice notes aren't meant to be long
        var mediaRecorder = null;
        var recordingChunks = [];
        var recordingStartedAt = 0;
        var recordingTimerId = null;
        var recordingStream = null;
        var recordingAudioCtx = null;
        var recordingAnalyser = null;
        var recordingWaveRAF = null;
        var recordingWaveBars = document.querySelectorAll("#recording-wave span");

        // Drives the waveform bars from the live mic level while recording.
        // Purely visual -- if AudioContext/AnalyserNode ever throws (some
        // very old browsers), recording itself still works, it just won't
        // animate.
        function tickRecordingWave() {
          if (!recordingAnalyser) return;
          var data = new Uint8Array(recordingAnalyser.frequencyBinCount);
          recordingAnalyser.getByteFrequencyData(data);
          var bars = recordingWaveBars.length;
          var chunk = Math.max(1, Math.floor(data.length / bars));
          for (var i = 0; i < bars; i++) {
            var sum = 0;
            for (var j = i * chunk; j < i * chunk + chunk; j++) sum += data[j] || 0;
            var avg = sum / chunk; // 0-255
            recordingWaveBars[i].style.height = 4 + Math.round((avg / 255) * 20) + "px";
          }
          recordingWaveRAF = requestAnimationFrame(tickRecordingWave);
        }

        function pickRecordingMimeType() {
          var candidates = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/ogg",
            "audio/mp4",
          ];
          for (var i = 0; i < candidates.length; i++) {
            if (
              window.MediaRecorder &&
              MediaRecorder.isTypeSupported &&
              MediaRecorder.isTypeSupported(candidates[i])
            ) {
              return candidates[i];
            }
          }
          return "";
        }
        function extensionForMimeType(mime) {
          if (mime.indexOf("ogg") !== -1) return "ogg";
          if (mime.indexOf("mp4") !== -1) return "m4a";
          return "webm";
        }
        function formatRecordingTime(ms) {
          var totalSec = Math.floor(ms / 1000);
          var m = Math.floor(totalSec / 60);
          var s = totalSec % 60;
          return m + ":" + (s < 10 ? "0" : "") + s;
        }
        function tickRecordingTimer() {
          var elapsed = Date.now() - recordingStartedAt;
          recordingTime.textContent = formatRecordingTime(elapsed);
          if (elapsed >= MAX_RECORDING_MS) stopRecording(true);
        }
        function showRecordingUI(on) {
          inputPill.classList.toggle("hidden", on);
          attachBtn.classList.toggle("hidden", on);
          cameraBtn.classList.toggle("hidden", on);
          if (on) {
            sendBtn.classList.add("hidden");
            micBtn.classList.add("hidden");
          } else {
            updateComposerState();
          }
          recordingBar.classList.toggle("hidden", !on);
        }
        function startRecording() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            toast("Voice notes aren't supported in this browser.", true);
            return;
          }
          closeContentPanel();
          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (stream) {
              recordingStream = stream;
              var mimeType = pickRecordingMimeType();
              try {
                mediaRecorder = mimeType
                  ? new MediaRecorder(stream, { mimeType: mimeType })
                  : new MediaRecorder(stream);
              } catch (err) {
                stream.getTracks().forEach(function (t) {
                  t.stop();
                });
                toast("Couldn't start recording on this device.", true);
                return;
              }
              recordingChunks = [];
              mediaRecorder.addEventListener("dataavailable", function (e) {
                if (e.data && e.data.size > 0) recordingChunks.push(e.data);
              });
              mediaRecorder.start();
              recordingStartedAt = Date.now();
              recordingTime.textContent = "0:00";
              recordingTimerId = setInterval(tickRecordingTimer, 250);
              showRecordingUI(true);
              try {
                recordingAudioCtx = new (window.AudioContext ||
                  window.webkitAudioContext)();
                recordingAnalyser = recordingAudioCtx.createAnalyser();
                recordingAnalyser.fftSize = 64;
                recordingAudioCtx
                  .createMediaStreamSource(stream)
                  .connect(recordingAnalyser);
                tickRecordingWave();
              } catch (err) {
                /* waveform is a nicety -- recording still works without it */
              }
            })
            .catch(function () {
              toast("Microphone access was denied or unavailable.", true);
            });
        }
        // Send is true to upload+send the recording, false to discard it --
        // both paths tear down the same recorder/stream/timer state, they
        // just differ in what happens to the resulting blob.
        function stopRecording(send) {
          if (!mediaRecorder) return;
          clearInterval(recordingTimerId);
          recordingTimerId = null;
          var mimeType = mediaRecorder.mimeType || "audio/webm";
          var recorder = mediaRecorder;
          mediaRecorder = null;
          function finish() {
            if (recordingStream) {
              recordingStream.getTracks().forEach(function (t) {
                t.stop();
              });
              recordingStream = null;
            }
            if (recordingWaveRAF) {
              cancelAnimationFrame(recordingWaveRAF);
              recordingWaveRAF = null;
            }
            recordingAnalyser = null;
            // Closing this (not just stopping the mic tracks above) matters
            // on some mobile browsers -- Android Chrome in particular has
            // been observed leaving the audio session routed for
            // "communication" (mic-in-use) mode after getUserMedia, which
            // can make a *just-recorded* voice note play back silently or
            // through the earpiece on the SAME device, even though it
            // sounds fine on any other device opening the same file/URL.
            // Fully releasing the AudioContext is the standard fix.
            if (recordingAudioCtx) {
              recordingAudioCtx.close().catch(function () {});
              recordingAudioCtx = null;
            }
            recordingWaveBars.forEach(function (b) {
              b.style.height = "4px";
            });
            showRecordingUI(false);
            if (send && recordingChunks.length > 0) {
              var blob = new Blob(recordingChunks, { type: mimeType });
              var ext = extensionForMimeType(mimeType);
              uploadBlobAndSend(blob, "voice-note." + ext, micBtn);
            }
            recordingChunks = [];
          }
          if (recorder.state === "inactive") {
            finish();
          } else {
            recorder.addEventListener("stop", finish, { once: true });
            recorder.stop();
          }
        }
        micBtn.addEventListener("click", startRecording);
        recordingCancelBtn.addEventListener("click", function () {
          stopRecording(false);
        });
        recordingSendBtn.addEventListener("click", function () {
          stopRecording(true);
        });

        // ---- websocket plumbing ----
        function wsUrl() {
          var proto = location.protocol === "https:" ? "wss://" : "ws://";
          return proto + location.host + "/";
        }
        function wsSend(text) {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(text);
        }

        function setReconnecting(on) {
          reconnecting = on;
          reconnectBanner.classList.toggle("show", on);
        }
        function scheduleReconnect() {
          if (manualDisconnect) return;
          setReconnecting(true);
          var delay = Math.min(
            RECONNECT_BASE_MS * Math.pow(2, reconnectAttempts),
            RECONNECT_MAX_MS,
          );
          reconnectAttempts++;
          reconnectTimer = setTimeout(function () {
            connect(myName);
          }, delay);
        }

        function connect(name) {
          ws = new WebSocket(wsUrl());
          ws.onopen = function () {
            ws.send(name);
          };
          ws.onclose = function () {
            if (manualDisconnect) {
              resetToLogin();
              return;
            }
            if (appEl.classList.contains("active")) {
              scheduleReconnect();
            } else {
              loginError.textContent = "Could not connect to server.";
              joinBtn.disabled = false;
            }
          };
          ws.onerror = function () {
            if (!appEl.classList.contains("active"))
              loginError.textContent = "Connection error.";
          };
          ws.onmessage = function (evt) {
            var data;
            try {
              data = JSON.parse(evt.data);
            } catch (e) {
              return;
            }
            handleServerMessage(data);
          };
        }

        // Mobile browsers (iOS Safari especially) suspend background tabs and
        // silently drop their WebSocket -- without this, a message sent while the
        // phone was locked/backgrounded would only arrive once the stale backoff
        // timer above happened to fire, up to RECONNECT_MAX_MS later. Reconnecting
        // the instant the tab is foregrounded again closes that gap.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "visible") return;
          if (manualDisconnect || !appEl.classList.contains("active")) return;
          if (
            ws &&
            (ws.readyState === WebSocket.OPEN ||
              ws.readyState === WebSocket.CONNECTING)
          )
            return;
          clearTimeout(reconnectTimer);
          reconnectAttempts = 0;
          connect(myName);
        });

        function resetToLogin() {
          clearTimeout(reconnectTimer);
          appEl.classList.remove("active");
          loginEl.style.display = "flex";
          conversations.clear();
          lastRenderedUnread.clear();
          messagesById.clear();
          pendingDelivery.clear();
          onlineUsers = [];
          myName = "";
          activeKey = "global";
          reconnectAttempts = 0;
          setReconnecting(false);
          joinBtn.disabled = false;
          nameInput.focus();
        }

        function handleServerMessage(data) {
          switch (data.type) {
            case "welcome": {
              // appEl already carries "active" only if this connection is a *reconnect*
              // (a transient drop while the app was already open) rather than a first
              // login -- use that to decide whether to snap the view back to "global"
              // or leave the user exactly where they were.
              var isFirstLogin = !appEl.classList.contains("active");
              myName = data.name;
              meName.textContent = "signed in as " + myName;
              meAvatar.textContent = initials(myName);
              meAvatar.style.background = avatarColor(myName);
              getOrCreateConversation("global", "global", "Everyone");
              loginEl.style.display = "none";
              appEl.classList.add("active");
              if (reconnecting) toast("Reconnected.");
              setReconnecting(false);
              reconnectAttempts = 0;
              if (isFirstLogin || !conversations.has(activeKey))
                activeKey = "global";
              if (isFirstLogin) requestNotificationPermissionOnce();
              renderTopbar();
              renderMessagesFull();
              renderChatList();
              renderOnlineList();
              msgInput.focus();
              wsSend("/list");
              wsSend("/groups");
              wsSend("/getprofile " + myName); // restore avatar/status set in an earlier session
              break;
            }
            case "error":
              if (reconnecting) {
                manualDisconnect = true;
                clearTimeout(reconnectTimer);
                resetToLogin();
                loginError.textContent = data.text + " Please rejoin.";
              } else if (appEl.classList.contains("active")) {
                toast(data.text, true);
              } else {
                loginError.textContent = data.text;
                joinBtn.disabled = false;
              }
              break;
            case "system":
              appendMessage("global", { kind: "system", text: data.text });
              wsSend("/list");
              break;
            case "chat": {
              var chatMsg = {
                id: data.id,
                text: data.text,
                from: data.from,
                fromLabel: data.from,
                reactions: [],
                replyTo: data.replyTo,
              };
              appendMessage("global", chatMsg);
              messagesById.set(data.id, { convKey: "global", msg: chatMsg });
              break;
            }
            case "private": {
              var key = "dm:" + data.from;
              getOrCreateConversation(key, "dm", data.from);
              var privMsg = {
                id: data.id,
                text: data.text,
                from: data.from,
                private: true,
                reactions: [],
                replyTo: data.replyTo,
              };
              appendMessage(key, privMsg);
              messagesById.set(data.id, { convKey: key, msg: privMsg });
              break;
            }
            case "history": {
              var histKey =
                data.scope === "global"
                  ? "global"
                  : data.scope === "dm"
                    ? "dm:" + data.with
                    : data.scope === "group"
                      ? "group:" + data.group
                      : null;
              var histConv = histKey && conversations.get(histKey);
              if (!histConv || histConv.historyLoaded) break;
              histConv.historyLoaded = true;
              var showLabel = data.scope !== "dm";
              var histEntries = (data.list || []).map(function (item) {
                var isOut = item.from === myName;
                var entry = {
                  id: item.id,
                  out: isOut,
                  text: item.text,
                  from: item.from,
                  fromLabel: showLabel && !isOut ? item.from : undefined,
                  private: !!item.private,
                  reactions: item.reactions || [],
                  preview: parsePreviewFromWire(item),
                  replyTo: item.replyTo,
                  deleted: !!item.deleted,
                  // Historical DMs were presumably already seen; only messages
                  // sent live this session should show the sent-→read progression.
                  status: isOut && item.private ? "read" : undefined,
                };
                if (entry.id !== undefined)
                  messagesById.set(entry.id, { convKey: histKey, msg: entry });
                return entry;
              });
              // History logically precedes anything already pushed live into this
              // conversation before the history response arrived.
              histConv.messages = histEntries.concat(histConv.messages);
              if (histKey === activeKey) renderMessagesFull();
              renderChatList();
              break;
            }
            case "typing":
              showTyping("global", data.text);
              break;
            case "typing_dm":
              showTyping("dm:" + data.from, data.from);
              break;
            case "group_typing":
              showTyping("group:" + data.group, data.from);
              break;
            case "dm_ack":
              resolvePendingDelivery("dm:" + data.with, {
                status: data.status,
                id: data.id,
              });
              break;
            case "dm_read":
              markConversationRead("dm:" + data.from);
              break;
            case "own_message_id":
              resolvePendingDelivery("global", { id: data.id });
              break;
            case "group_msg_ack":
              resolvePendingDelivery("group:" + data.group, { id: data.id });
              break;
            case "reaction":
              applyReactionUpdate(data.messageId, data.reactions);
              break;
            case "dm_reaction":
              applyReactionUpdate(data.messageId, data.reactions);
              break;
            case "group_reaction":
              applyReactionUpdate(data.messageId, data.reactions);
              break;
            case "deleted":
            case "dm_deleted":
            case "group_deleted":
              applyMessageDeleted(data.messageId);
              break;
            case "link_preview":
            case "dm_link_preview":
            case "group_link_preview":
              applyLinkPreviewUpdate(
                data.messageId,
                parsePreviewFromWire(data),
              );
              break;
            case "gif_results":
              // Ignore a response to a since-superseded query (e.g. the user kept
              // typing after this search went out, or switched tabs) -- only the
              // latest request for the currently-visible tab lands in the grid.
              if (
                !contentPanel.classList.contains("hidden") &&
                activeTab === "gif" &&
                data.query === gifSearch.value
              ) {
                renderMediaResults(
                  gifGrid,
                  data.results,
                  "No GIFs found.",
                  closeContentPanel,
                );
              }
              break;
            case "sticker_results":
              if (
                !contentPanel.classList.contains("hidden") &&
                activeTab === "sticker" &&
                data.query === stickerSearch.value
              ) {
                renderMediaResults(
                  stickerGrid,
                  data.results,
                  "No stickers found.",
                  closeContentPanel,
                );
              }
              break;
            case "users":
              onlineUsers = data.list;
              renderOnlineList();
              renderTopbar();
              break;
            case "group_created": {
              var gkey = "group:" + data.name;
              var isNew = !conversations.has(gkey);
              getOrCreateConversation(
                gkey,
                "group",
                data.name,
                data.list || data.members,
              );
              if (isNew && pendingGroupInvites.length > 0) {
                pendingGroupInvites.forEach(function (u) {
                  wsSend("/addmember " + data.name + " " + u);
                });
                pendingGroupInvites = [];
              }
              if (activeKey === gkey) renderTopbar();
              if (isNew) {
                switchConversation(gkey);
                toast("Group “" + data.name + "” created.");
              }
              renderChatList();
              if (
                !membersModal.classList.contains("hidden") &&
                activeKey === gkey
              )
                openMembersModal();
              break;
            }
            case "group_message": {
              var gmkey = "group:" + data.group;
              getOrCreateConversation(gmkey, "group", data.group);
              var groupMsg = {
                id: data.id,
                text: data.text,
                from: data.from,
                fromLabel: data.from,
                reactions: [],
                replyTo: data.replyTo,
              };
              appendMessage(gmkey, groupMsg);
              messagesById.set(data.id, { convKey: gmkey, msg: groupMsg });
              break;
            }
            case "group_system": {
              var gskey = "group:" + data.group;
              getOrCreateConversation(gskey, "group", data.group);
              appendMessage(gskey, { kind: "system", text: data.text });
              break;
            }
            case "added_to_group": {
              var akey = "group:" + data.name;
              var wasNew = !conversations.has(akey);
              getOrCreateConversation(akey, "group", data.name, data.members);
              appendMessage(akey, {
                kind: "system",
                text: data.by + " added you to this group.",
              });
              if (wasNew)
                toast(
                  "You were added to “" + data.name + "” by " + data.by + ".",
                );
              break;
            }
            case "left_group": {
              var lkey = "group:" + data.text;
              conversations.delete(lkey);
              lastRenderedUnread.delete(lkey);
              if (activeKey === lkey) switchConversation("global");
              else renderChatList();
              break;
            }
            case "groups":
              (data.list || []).forEach(function (g) {
                getOrCreateConversation(
                  "group:" + g.name,
                  "group",
                  g.name,
                  g.members,
                );
              });
              renderChatList();
              if (activeKey.indexOf("group:") === 0) renderTopbar();
              break;
            case "profile":
              profileCache.set(data.user, {
                avatar: data.avatar || null,
                status: data.status || null,
              });
              if (data.user === myName) {
                myAvatarUrl = data.avatar || null;
                myStatus = data.status || null;
                renderMyProfile();
              }
              // Refresh anywhere this user's avatar is already on screen --
              // cheap since renderChatList/renderOnlineList just redraw
              // from current state, no extra round trip.
              renderChatList();
              renderOnlineList();
              break;
          }
        }

        // ---- login flow ----
        function doJoin() {
          var name = nameInput.value.trim();
          if (!name) {
            loginError.textContent = "Enter a username.";
            return;
          }
          if (name.length > MAX_USERNAME_LEN) {
            loginError.textContent =
              "Username too long (max " + MAX_USERNAME_LEN + " chars).";
            return;
          }
          loginError.textContent = "";
          joinBtn.disabled = true;
          manualDisconnect = false;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(name);
          } else {
            connect(name);
          }
        }
        joinBtn.addEventListener("click", doJoin);
        nameInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") doJoin();
        });

        logoutBtn.addEventListener("click", function () {
          manualDisconnect = true;
          wsSend("/quit");
          // Clears the signed-in session (if any) so a Google/Apple sign-in
          // doesn't silently auto-rejoin on the next visit -- a plain guest
          // username never set this cookie, so this is a harmless no-op
          // for that case rather than something that needs to branch on it.
          fetch("/auth/logout", { method: "POST" })
            .catch(function () {})
            .finally(function () {
              location.reload();
            });
        });

        // ---- Google/Apple sign-in ----
        // Both buttons are a plain top-level navigation to a /auth/<provider>/start
        // route, not a popup or fetch -- the provider's consent screen has to be
        // the actual top-level page for a real OAuth redirect flow to work (and
        // it sidesteps popup-blocker issues entirely). oauth_config.erl's doc
        // comment covers what's needed to make these functional; until then the
        // server 302s back here with ?authError=... instead of erroring, so this
        // reads as "not set up yet" rather than a broken button.
        googleSigninBtn.addEventListener("click", function () {
          location.href = "/auth/google/start";
        });
        appleSigninBtn.addEventListener("click", function () {
          location.href = "/auth/apple/start";
        });

        function consumeAuthErrorFromUrl() {
          var params = new URLSearchParams(location.search);
          var err = params.get("authError");
          if (!err) return;
          var provider = err.indexOf("google") === 0 ? "Google" : "Apple";
          toast(
            provider +
              " sign-in isn't set up on this server yet -- use a guest username for now.",
            true,
          );
          params.delete("authError");
          var rest = params.toString();
          history.replaceState(
            null,
            "",
            location.pathname + (rest ? "?" + rest : ""),
          );
        }

        // Checked once on load: a Google/Apple sign-in sets a session cookie
        // server-side (see chat_web.erl's complete_login/4), so a returning
        // visitor who already has one skips typing a username at all -- this
        // is the actual point of adding sign-in, not just an alternative
        // button next to the existing guest flow.
        function checkExistingSession() {
          fetch("/auth/session")
            .then(function (res) {
              return res.json();
            })
            .then(function (data) {
              if (data && data.username) {
                nameInput.value = data.username;
                doJoin();
              } else {
                nameInput.focus();
              }
            })
            .catch(function () {
              nameInput.focus();
            });
        }

        consumeAuthErrorFromUrl();
        checkExistingSession();
      })();
    </script>
  </body>
</html>
